# Mutation testing of the Rust code a pull request changes (cargo mutants --in-diff).
# Opt-in (takes 10 min to hours): touch the trigger file, comment the phrase, or dispatch.
# Informational: missed mutants are reported in the log and artifact, never failing the job.

name: PreCommit Rust Mutants

on:
  pull_request_target:
    branches: ['master', 'release-*']
    paths: ['.github/trigger_files/beam_PreCommit_Rust_Mutants.json']
  issue_comment:
    types: [created]
  workflow_dispatch:

#Setting explicit permissions for the action to avoid the default permissions which are `write-all` in case of pull_request_target event
permissions:
  actions: write
  pull-requests: read
  checks: read
  contents: read
  deployments: read
  id-token: none
  issues: read
  discussions: read
  packages: read
  pages: read
  repository-projects: read
  security-events: read
  statuses: read

# This allows a subsequently queued workflow run to interrupt previous runs
concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.number || github.event.pull_request.head.label || github.sha || github.head_ref || github.ref }}-${{ github.event.schedule || github.event.comment.id || github.event.sender.login }}'
  cancel-in-progress: true

env:
  DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
  GRADLE_ENTERPRISE_CACHE_USERNAME: ${{ secrets.GE_CACHE_USERNAME }}
  GRADLE_ENTERPRISE_CACHE_PASSWORD: ${{ secrets.GE_CACHE_PASSWORD }}

jobs:
  beam_PreCommit_Rust_Mutants:
    name: ${{ matrix.job_name }} (${{ matrix.job_phrase }})
    runs-on: [self-hosted, ubuntu-24.04, main]
    strategy:
      matrix:
        job_name: [beam_PreCommit_Rust_Mutants]
        job_phrase: [Run Rust Mutants PreCommit]
    timeout-minutes: 180
    # Non-blocking until the mutation score of changed code is tracked.
    continue-on-error: true
    if: |
      github.event_name == 'pull_request_target' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.comment.body == 'Run Rust Mutants PreCommit'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: ./.github/actions/setup-action
        with:
          comment_phrase: ${{ matrix.job_phrase }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_job: ${{ matrix.job_name }} (${{ matrix.job_phrase }})
      - name: Setup environment
        uses: ./.github/actions/setup-environment-action
        with:
          java-version: default
      - name: Compute the Rust diff against the base branch
        env:
          # issue_comment and workflow_dispatch events carry no base ref.
          BASE_REF: ${{ github.base_ref || 'master' }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          # The checkout is shallow; fetch enough history for a merge base.
          git fetch --no-tags --depth=200 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if [ -n "${PR_NUMBER}" ]; then
            git fetch --no-tags --deepen=200 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pull/${PR_NUMBER}/head" || true
          fi
          # Paths relative to sdks/rust, which is how cargo-mutants names files.
          if git merge-base "origin/${BASE_REF}" HEAD > /dev/null 2>&1; then
            git diff --relative=sdks/rust "origin/${BASE_REF}...HEAD" -- '*.rs' > "${RUNNER_TEMP}/rust.diff"
          else
            git diff --relative=sdks/rust "origin/${BASE_REF}" HEAD -- '*.rs' > "${RUNNER_TEMP}/rust.diff"
          fi
          echo "Changed Rust files:"
          grep '^+++ b/' "${RUNNER_TEMP}/rust.diff" | sed 's#^+++ b/#  #' || echo "  (none)"
      - name: run mutants script
        uses: ./.github/actions/gradle-command-self-hosted-action
        with:
          gradle-command: :sdks:rust:mutants
          arguments: |
            -PinDiff=${{ runner.temp }}/rust.diff \
            -Pjobs=4 \
            -Ptimeout=30
      - name: Archive mutants.out
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Rust Mutants Results
          path: |
            sdks/rust/build/reports/test-quality/workspace/mutants/mutants.out/
            sdks/rust/build/reports/test-quality/workspace/mutants/kill_matrix.*
          if-no-files-found: ignore

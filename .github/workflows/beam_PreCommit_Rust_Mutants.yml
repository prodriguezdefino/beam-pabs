# Mutation testing of the Rust code a pull request changes (cargo mutants --in-diff).
# Opt-in: touch the trigger file or dispatch manually.
# Informational: missed mutants are reported in the log and artifact, never failing the job.

name: PreCommit Rust Mutants

on:
  pull_request:
    branches: ['master', 'release-*']
    paths:
      - 'release/trigger_all_tests.json'
      - '.github/trigger_files/beam_PreCommit_Rust_Mutants.json'
  workflow_dispatch:
    inputs:
      base_ref:
        description: 'Base branch for computing the Rust diff'
        required: false
        default: 'master'
        type: string

permissions:
  actions: write
  pull-requests: read
  checks: read
  contents: read
  deployments: read
  id-token: none
  issues: read
  discussions: read
  packages: read
  pages: read
  repository-projects: read
  security-events: read
  statuses: read

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.number || github.event.pull_request.head.label || github.sha || github.head_ref || github.ref }}-${{ github.event.schedule || github.event.sender.login }}'
  cancel-in-progress: true

env:
  DEVELOCITY_ACCESS_KEY: ${{ secrets.BEAM_DEVELOCITY_ACCESS_KEY }}

jobs:
  beam_PreCommit_Rust_Mutants:
    name: ${{ matrix.job_name }}
    runs-on: [self-hosted, ubuntu-24.04, main]
    strategy:
      matrix:
        job_name: [beam_PreCommit_Rust_Mutants]
    timeout-minutes: 180
    continue-on-error: true
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup repository
        uses: $/.github/actions/setup-action
      - name: Setup environment
        uses: $/.github/actions/setup-environment-action
        with:
          java-version: default
          rust-version: default
      - name: Compute the Rust diff against the base branch
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref || inputs.base_ref || 'master' }}
        run: |
          set -euo pipefail
          mkdir -p sdks/rust/build
          git fetch --no-tags --depth=200 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          if git merge-base "origin/${BASE_REF}" HEAD > /dev/null 2>&1; then
            git diff --relative=sdks/rust "origin/${BASE_REF}...HEAD" -- '*.rs' > sdks/rust/build/rust-pr.diff
          else
            git diff --relative=sdks/rust "origin/${BASE_REF}" HEAD -- '*.rs' > sdks/rust/build/rust-pr.diff
          fi
          echo "Changed Rust files:"
          grep '^+++ b/' sdks/rust/build/rust-pr.diff | sed 's#^+++ b/#  #' || echo "  (none)"
      - name: Run mutants task
        uses: $/.github/actions/gradle-command-self-hosted-action
        with:
          gradle-command: :sdks:rust:mutants
          arguments: |
            -PinDiff=build/rust-pr.diff \
            -Pjobs=4 \
            -Ptimeout=30
      - name: Archive mutants.out
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Rust Mutants Results
          path: |
            sdks/rust/build/reports/test-quality/workspace/mutants/mutants.out/
            sdks/rust/build/reports/test-quality/workspace/mutants/kill_matrix.*
          if-no-files-found: ignore

# The Iceberg benchmark in a Rust pipeline (`./gradlew :sdks:rust:icebergBenchmark -Ppipeline=rust`).
# The package name is also the name of the binary, so the worker build of the benchmark
# harness finds it.
[package]
name = "iceberg_benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Iceberg benchmark of the Apache Beam Rust SDK: the native Kafka read and the native Iceberg write in one Rust pipeline"
publish = false

[[bin]]
name = "iceberg_benchmark"
path = "src/main.rs"

[dependencies]
beam = { workspace = true, features = ["prism", "dataflow", "kafka-native", "iceberg"] }
chrono = { workspace = true }
clap = { workspace = true }
# The `Touch` step and the metric names of the Kafka benchmark, so the reports match.
kafka_benchmark = { path = "../../kafka/rust" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

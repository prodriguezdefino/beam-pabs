# The Kafka benchmark in a Rust pipeline (`./gradlew :sdks:rust:kafkaBenchmark -Ppipeline=rust`).
# The package name is also the name of the binary, so the worker build of the benchmark
# harness (`compileWorkers`) and `-Pexample=kafka_benchmark` find it.
[package]
name = "kafka_benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Kafka benchmark of the Apache Beam Rust SDK: the native Kafka read and write in one Rust pipeline"
publish = false

[[bin]]
name = "kafka_benchmark"
path = "src/main.rs"

[dependencies]
# Both runners are linked, so `--runner=prism|dataflow` selects one at run time. The default
# features install mimalloc, as in the worker of the Rust expansion service.
beam = { workspace = true, features = ["prism", "dataflow", "kafka-native"] }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true

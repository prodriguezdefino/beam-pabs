# The Cloud Bigtable benchmark in a Rust pipeline
# (`./gradlew :sdks:rust:bigtableBenchmark -Ppipeline=rust`).
# The package name is also the name of the binary, so the worker build of the benchmark
# harness (`compileWorkers`) finds it.
[package]
name = "bigtable_benchmark"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Cloud Bigtable benchmark of the Apache Beam Rust SDK: native Bigtable read to GCS in one Rust pipeline"
publish = false

[[bin]]
name = "bigtable_benchmark"
path = "src/main.rs"

[dependencies]
# Both runners are linked, so `--runner=prism|dataflow` selects one at run time.
beam = { workspace = true, features = ["prism", "dataflow", "gcp-bigtable", "gcp-gcs"] }
tokio = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }

[lints]
workspace = true

[package]
name = "apache-beam-runner-dataflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Beam Dataflow runner for Google Cloud Dataflow execution"

[lib]
name = "dataflow"

[dependencies]
beam = { package = "apache-beam-core", path = "../../core", version = "2.78.0-SNAPSHOT" }
model = { workspace = true }
file = { workspace = true }
gcp = { workspace = true }
inventory = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
google-cloud-auth = { workspace = true }
# `TestDataflowRunner` decides on assertions with the same helpers as `TestPipeline`.
testing = { workspace = true }

[dev-dependencies]
dataflow = { package = "apache-beam-runner-dataflow", path = "." }
fluent = { workspace = true }
testutils = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true

[package]
name = "apache-beam-runner-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Integration tests for Apache Beam Rust SDK transforms that require a runner to execute"
publish = false

# Named "tests" for succinct internal usage in integration test binaries.
[lib]
name = "beam_runner_tests"
test = false
doctest = false

[[bin]]
name = "beam-runner-tests-worker"
path = "src/worker.rs"
test = false

[[bin]]
name = "beam-runner-tests-expansion-service"
path = "src/expansion_service.rs"
test = false

[[test]]
name = "validates_runner_prism"
path = "tests/validates_runner_prism/main.rs"
harness = false

[[test]]
name = "validates_runner_dataflow"
path = "tests/validates_runner_dataflow/main.rs"
harness = false
test = false

[dependencies]
beam = { workspace = true, features = ["fluent", "io-file", "gcp-gcs", "gcp-bigquery", "gcp-bigtable", "gcp-pubsub", "derive", "external", "prism", "dataflow", "testing", "parquet", "avro", "tfrecord"] }
beam_runner_prism = { workspace = true }
beam_io_file = { workspace = true }
beam_io_gcp = { workspace = true, features = ["gcs"] }
beam_fluent = { workspace = true }
beam_external = { workspace = true }
beam_expansion = { workspace = true }
clap = { workspace = true }
inventory = { workspace = true }
prost = { workspace = true }
rust_decimal = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
beam_harness = { workspace = true }
beam_model = { workspace = true }
tonic = { workspace = true }

[lints]
workspace = true


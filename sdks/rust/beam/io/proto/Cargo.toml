[package]
name = "apache-beam-io-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Beam schema and Row bridge to Protocol Buffers for the Apache Beam Rust SDK"

[lib]
name = "beam_io_proto"
test = false

[dependencies]
beam = { package = "apache-beam-core", path = "../../core", version = "2.79.0-SNAPSHOT" }
# The descriptor pool and the dynamic messages.
prost = { workspace = true }
prost-reflect = { workspace = true }

[dev-dependencies]
# The file descriptor sets of the tests.
prost-types = { workspace = true }

[lints]
workspace = true

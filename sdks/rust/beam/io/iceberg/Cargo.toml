[package]
name = "apache-beam-io-iceberg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Apache Iceberg write connector for the Apache Beam Rust SDK"

[lints]
workspace = true

[lib]
name = "iceberg_io"

[features]
default = ["gcp"]
# Google auth for the catalog, `gs://` paths, and vended GCS tokens.
gcp = ["dep:gcp", "gcp/gcs", "dep:google-cloud-auth", "dep:http"]

[dependencies]
beam = { package = "apache-beam-core", path = "../../core", version = "2.79.0-SNAPSHOT", features = ["derive"] }
arrow_io = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
file = { workspace = true }
futures = { workspace = true }
iceberg = { workspace = true }
iceberg-catalog-rest = { workspace = true }
murmur3 = { workspace = true }
parquet = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
typetag = { workspace = true }
uuid = { workspace = true }
# The HTTP client of the catalog. `iceberg-catalog-rest` uses reqwest 0.12 with no TLS, so the
# connection builds the client with rustls and passes it to the catalog.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
gcp = { workspace = true, optional = true }
google-cloud-auth = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }

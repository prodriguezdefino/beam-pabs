[package]
name = "apache-beam-io-kafka"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Apache Kafka I/O connector (librdkafka) of the Apache Beam Rust SDK"

[lib]
name = "beam_io_kafka"
test = false

# The connector builds librdkafka and OpenSSL from source.
[dependencies]
beam = { package = "apache-beam-core", path = "../../core", version = "2.79.0-SNAPSHOT" }
rdkafka = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tracing = { workspace = true }
# The JSON format: JSON Schemas to Beam schemas, and rows to and from JSON objects.
beam_io_json = { workspace = true }
# The Application Default Credentials of Google Cloud Managed Service for Apache Kafka.
beam_gcp_core = { workspace = true }
# The AVRO format: Avro schemas to Beam schemas, and rows to and from Avro datums.
beam_io_avro = { workspace = true }
# The PROTO format: Protocol Buffers messages to and from rows.
beam_io_proto = { workspace = true }
# The HTTP client of the schema registry. The decoder calls it from the sync reader.
ureq = { workspace = true }

[dev-dependencies]
beam_model = { workspace = true }
# The file descriptor sets and the messages of the PROTO tests, and the payloads of the model.
prost = { workspace = true }
prost-types = { workspace = true }
rdkafka = { workspace = true, features = ["tokio"] }
serde_json = { workspace = true }
beam_test_utils = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
# For benches/copy_throughput.rs: the Prism runner, worker logging and pipeline options. The
# facade does not enable its `kafka` feature, so it does not build a second copy of this crate.
beam_sdk = { package = "apache-beam", path = "../..", default-features = false, features = ["prism", "fluent"] }
clap = { workspace = true }
serde = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "copy_throughput"
harness = false

[[bench]]
name = "typed_encode"
harness = false

[lints]
workspace = true

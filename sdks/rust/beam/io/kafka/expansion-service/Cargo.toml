[package]
name = "apache-beam-io-kafka-expansion-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Expansion service with the native Kafka connector of the Apache Beam Rust SDK"

[lib]
name = "kafka_expansion"

[[bin]]
name = "beam-kafka-expansion-service"
path = "src/main.rs"

[dependencies]
# The SDK facade: the native connector is `beam::io::kafka::native`. Its `mimalloc` feature
# installs mimalloc as the global allocator of the worker.
beam = { package = "apache-beam", path = "../../..", version = "2.78.0-SNAPSHOT", default-features = false, features = ["derive", "kafka-native", "mimalloc"] }
expansion = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

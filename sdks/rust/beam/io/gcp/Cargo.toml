[package]
name = "apache-beam-io-gcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Google Cloud Platform I/O connectors (GCS, BigQuery, Bigtable, Pub/Sub) for Apache Beam Rust SDK"

[lib]
name = "beam_io_gcp"
test = false

[features]
# One feature per module: each enables only its own dependencies.
default = ["gcs", "bigquery", "bigtable", "pubsub", "options", "secret-manager"]
options = ["dep:clap", "dep:inventory"]
secret-manager = ["dep:google-cloud-secretmanager-v1", "dep:inventory"]
gcs = [
    "beam_gcp_core/retry",
    "dep:beam_io_file",
    "dep:google-cloud-auth",
    "dep:google-cloud-storage",
    "dep:google-cloud-gax",
    "dep:futures",
    "dep:bytes",
    "dep:inventory",
]
# BigQuery Storage Read API reads and Storage Write API writes. They pull in arrow-rs
# and the BigQuery clients.
bigquery = [
    "options",
    "beam_gcp_core/grpc",
    "dep:google-cloud-gax",
    "dep:bytes",
    "dep:google-cloud-bigquery",
    "dep:google-cloud-bigquery-v2",
    "dep:google-cloud-wkt",
    "dep:uuid",
    "dep:beam_io_arrow",
    "dep:arrow-ipc",
    "dep:chrono",
    "dep:prost",
    "dep:tonic",
    "dep:google-cloud-gax-internal",
    "dep:beam_io_gcp_googleapis",
    "beam_io_gcp_googleapis/bigquery-storage",
]
bigtable = [
    "beam_gcp_core/grpc",
    "dep:base64",
    "dep:bytes",
    "dep:prost",
    "dep:tonic",
    "dep:google-cloud-gax",
    "dep:google-cloud-gax-internal",
    "dep:beam_io_gcp_googleapis",
    "beam_io_gcp_googleapis/bigtable",
]
pubsub = ["dep:beam_external"]

[dependencies]
beam = { package = "apache-beam-core", path = "../../core", version = "2.79.0-SNAPSHOT", features = ["derive"] }
beam_gcp_core = { workspace = true }
beam_io_file = { workspace = true, optional = true }
beam_external = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
google-cloud-auth = { workspace = true, optional = true }
google-cloud-storage = { workspace = true, optional = true }
google-cloud-gax = { workspace = true, optional = true }
google-cloud-secretmanager-v1 = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
google-cloud-bigquery = { workspace = true, optional = true }
google-cloud-bigquery-v2 = { workspace = true, optional = true }
# The snapshot time of a read session.
google-cloud-wkt = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
beam_io_arrow = { workspace = true, optional = true }
# The Arrow IPC codecs of compressed Storage Read responses.
arrow-ipc = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
# The gRPC transport and the messages of the calls that no client library makes: the Bigtable
# data API and the BatchCommitWriteStreams call of exactly-once writes, which the Write client
# of google-cloud-bigquery has for one stream only.
google-cloud-gax-internal = { workspace = true, optional = true }
beam_io_gcp_googleapis = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tonic = { workspace = true, optional = true }

[dev-dependencies]
beam_model = { workspace = true }
beam_test_utils = { workspace = true }
beam_io_arrow = { workspace = true }
google-cloud-auth = { workspace = true }
google-cloud-bigquery = { workspace = true }
google-cloud-bigquery-v2 = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true }
tonic-prost = { workspace = true }
tokio-stream = { workspace = true }

[[test]]
name = "gcs"
path = "tests/gcs/main.rs"
required-features = ["gcs"]

[[test]]
name = "bigquery"
path = "tests/bigquery/main.rs"
required-features = ["bigquery"]

[[test]]
name = "bigtable"
path = "tests/bigtable/main.rs"
required-features = ["bigtable"]

[[test]]
name = "pubsub"
path = "tests/pubsub/main.rs"
required-features = ["pubsub"]

[[test]]
name = "options"
path = "tests/options/main.rs"
required-features = ["options", "secret-manager"]

[lints]
workspace = true

[package]
name = "apache-beam-io-gcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Google Cloud Platform I/O connectors (GCS, BigQuery, Bigtable, Pub/Sub) for Apache Beam Rust SDK"

[lib]
name = "gcp"

[dependencies]
beam = { package = "apache-beam-core", path = "../../core", version = "2.78.0-SNAPSHOT" }
file = { workspace = true }
clap = { workspace = true }
inventory = { workspace = true }
google-cloud-storage = { workspace = true }
google-cloud-gax = { workspace = true }
google-cloud-secretmanager-v1 = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
gcp = { package = "apache-beam-io-gcp", path = "." }

[lints]
workspace = true

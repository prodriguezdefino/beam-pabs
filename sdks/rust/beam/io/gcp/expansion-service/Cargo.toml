[package]
name = "apache-beam-io-gcp-expansion-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Expansion service with the native Google Cloud connectors of the Apache Beam Rust SDK"

[lib]
name = "gcp_expansion"

[[bin]]
name = "beam-gcp-expansion-service"
path = "src/main.rs"

[dependencies]
beam = { package = "apache-beam-core", path = "../../../core", version = "2.78.0-SNAPSHOT" }
gcp = { workspace = true, features = ["bigquery-storage"] }
expansion = { workspace = true }
tokio = { workspace = true }
mimalloc = { workspace = true }

[lints]
workspace = true

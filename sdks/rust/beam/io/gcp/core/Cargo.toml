[package]
name = "apache-beam-gcp-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared Google Cloud credentials, async client runtime, gRPC transport and retry helpers for the Apache Beam Rust SDK"

[lib]
name = "beam_gcp_core"
test = false

[features]
default = []
retry = ["dep:google-cloud-gax"]
grpc = ["retry", "dep:google-cloud-gax-internal"]

[dependencies]
beam = { package = "apache-beam-core", path = "../../../core", version = "2.79.0-SNAPSHOT" }
google-cloud-auth = { workspace = true }
google-cloud-gax = { workspace = true, optional = true }
google-cloud-gax-internal = { workspace = true, optional = true }
rustls = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[package]
name = "apache-beam-io-parquet"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Parquet I/O connector for the Apache Beam Rust SDK, built on arrow-rs"

[lints]
workspace = true

[lib]
name = "parquet_io"

[dependencies]
beam = { package = "apache-beam-core", path = "../../core", version = "2.78.0-SNAPSHOT" }
file = { workspace = true }
arrow_io = { workspace = true }
arrow-array = { workspace = true }
arrow-schema = { workspace = true }
parquet = { workspace = true }
bytes = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
beam = { package = "apache-beam-core", path = "../../core", version = "2.78.0-SNAPSHOT", features = ["derive"] }
chrono = { workspace = true }

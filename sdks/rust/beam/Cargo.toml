[package]
name = "apache-beam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Apache Beam Rust SDK umbrella crate"

[lib]
name = "beam"

[features]
default = ["fluent", "io-file", "gcs", "managed", "derive", "external"]
fluent = ["dep:fluent"]
io-file = ["dep:file"]
gcs = ["dep:gcp", "io-file"]
# Columnar formats via arrow-rs. Off by default: they pull in arrow and codec crates.
arrow = ["dep:arrow_io"]
parquet = ["dep:parquet_io", "arrow", "io-file"]
avro = ["dep:avro_io", "arrow", "io-file"]
# Cross-language Kafka via the Java expansion service. Off by default.
kafka = ["dep:kafka_io", "external"]
# Managed I/O (Iceberg, Kafka, BigQuery, JDBC, Delta Lake) via the Java expansion
# service. On by default: it is small and `gcs` and `kafka` build on it anyway.
managed = ["dep:managed_io", "external"]
derive = ["core/derive"]
external = ["dep:external"]
expansion = ["dep:expansion"]
# The worker harness is a consequence of choosing a portable runner, not an
# independent choice, so runners enable it rather than the user.
harness = ["dep:harness"]
prism = ["dep:prism", "harness"]
# `passert` and `TestStream`, as `beam::testing`. Usually enabled for tests only.
testing = ["dep:testing"]

[dependencies]
core = { workspace = true }
model = { workspace = true }
fluent = { workspace = true, optional = true }
harness = { workspace = true, optional = true }
file = { workspace = true, optional = true }
gcp = { workspace = true, optional = true }
arrow_io = { workspace = true, optional = true }
parquet_io = { workspace = true, optional = true }
avro_io = { workspace = true, optional = true }
kafka_io = { workspace = true, optional = true }
managed_io = { workspace = true, optional = true }
external = { workspace = true, optional = true }
expansion = { workspace = true, optional = true }
prism = { workspace = true, optional = true }
testing = { workspace = true, optional = true }

[lints]
workspace = true

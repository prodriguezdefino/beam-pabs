[package]
name = "apache-beam"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Apache Beam Rust SDK umbrella crate"

[lib]
name = "beam"
test = false

# A pipeline needs a runner, the Fn API worker harness, the connectors it reads
# and writes with, and the schema derive. Cargo links transitive crates but does
# not make them nameable, and link-time registries (`inventory`) only populate
# for linked crates -- so the facade both depends on them and
# re-exports them, letting a user declare one dependency:
#
#     beam = { package = "apache-beam", version = "0.1", features = ["dataflow"] }
#
# Default features include `prism`, and features are additive, so `dataflow` alone also
# links Prism. Set `default-features = false` to build without Prism.
[features]
default = ["fluent", "io-file", "derive", "prism", "mimalloc"]
# Installs mimalloc as the process-wide `#[global_allocator]`. A Beam worker
# allocates and frees a buffer per element per fused operator from many threads
# at once, which is where the system (glibc) allocator is weakest. Disable
# default features to opt out, e.g. to install a different global allocator.
mimalloc = ["dep:mimalloc"]
fluent = ["dep:beam_fluent"]
io-file = ["dep:beam_io_file"]
# Google Cloud: one feature per connector (D8), plus `GcpOptions` and Secret Manager.
gcp-gcs = ["dep:beam_io_gcp", "beam_io_gcp/gcs", "beam_io_gcp/options", "beam_io_gcp/secret-manager", "io-file"]
# BigQuery Storage Read API reads and Storage Write API writes. They pull in arrow-rs
# and the BigQuery clients.
gcp-bigquery = ["dep:beam_io_gcp", "beam_io_gcp/bigquery", "beam_io_gcp/options", "beam_io_gcp/secret-manager"]
gcp-bigtable = ["dep:beam_io_gcp", "beam_io_gcp/bigtable", "beam_io_gcp/options", "beam_io_gcp/secret-manager"]
gcp-pubsub = ["dep:beam_io_gcp", "beam_io_gcp/pubsub", "beam_io_gcp/options", "beam_io_gcp/secret-manager", "external"]
# Columnar formats with arrow-rs. Off by default: they pull in arrow and codec crates.
arrow = ["dep:beam_io_arrow"]
parquet = ["dep:beam_io_parquet", "arrow", "io-file"]
avro = ["dep:beam_io_avro", "arrow", "io-file"]
# TFRecord files. Off by default.
tfrecord = ["dep:beam_io_tfrecord", "io-file"]
# Beam schemas and rows to and from JSON. Off by default.
json = ["dep:beam_io_json"]
# Beam schemas and rows to and from Protocol Buffers messages. Off by default.
proto = ["dep:beam_io_proto"]
# The Kafka connector on librdkafka, in `beam::io::kafka`. Off by default: it builds
# librdkafka and OpenSSL from source.
kafka = ["dep:beam_io_kafka", "avro", "json", "proto"]
# The native Iceberg write, in `beam::io::iceberg`. Off by default: it pulls in the `iceberg`
# crates.
iceberg = ["dep:beam_io_iceberg"]
# Managed I/O (Iceberg, Kafka, BigQuery, JDBC, Delta Lake) through the Java expansion
# service.
managed = ["dep:beam_io_managed", "external"]
derive = ["beam_core/derive"]
external = ["dep:beam_external"]
expansion = ["dep:beam_expansion"]
# The worker harness is a consequence of choosing a portable runner, not an
# independent choice, so runners enable it rather than the user.
harness = ["dep:beam_harness"]
prism = ["dep:beam_runner_prism", "harness"]
dataflow = ["dep:beam_runner_dataflow", "harness"]
# `passert` and `TestStream`, as `beam::testing`. Usually enabled for tests only.
testing = ["dep:beam_testing"]
# Machine learning inference and hardware acceleration
ml = ["dep:beam_ml"]
ml-remote = ["ml", "beam_ml/remote"]
ml-candle = ["ml", "beam_ml/candle"]
ml-candle-cuda = ["ml", "beam_ml/candle-cuda"]
ml-candle-metal = ["ml", "beam_ml/candle-metal"]
ml-onnx = ["ml", "beam_ml/onnx"]
ml-onnx-dynamic = ["ml", "beam_ml/onnx-dynamic"]
ml-onnx-cuda = ["ml", "beam_ml/onnx-cuda"]
ml-onnx-tensorrt = ["ml", "beam_ml/onnx-tensorrt"]
ml-onnx-coreml = ["ml", "beam_ml/onnx-coreml"]
ml-onnx-download = ["ml-onnx", "beam_ml/onnx-download-binaries"]

[dependencies]
beam_core = { workspace = true }
beam_model = { workspace = true }
beam_fluent = { workspace = true, optional = true }
beam_harness = { workspace = true, optional = true }
beam_io_file = { workspace = true, optional = true }
beam_io_gcp = { workspace = true, optional = true }
beam_io_arrow = { workspace = true, optional = true }
beam_io_parquet = { workspace = true, optional = true }
beam_io_avro = { workspace = true, optional = true }
beam_io_tfrecord = { workspace = true, optional = true }
beam_io_json = { workspace = true, optional = true }
beam_io_proto = { workspace = true, optional = true }
beam_io_kafka = { workspace = true, optional = true }
beam_io_managed = { workspace = true, optional = true }
beam_io_iceberg = { workspace = true, optional = true }
beam_external = { workspace = true, optional = true }
beam_expansion = { workspace = true, optional = true }
beam_runner_prism = { workspace = true, optional = true }
beam_runner_dataflow = { workspace = true, optional = true }
beam_testing = { workspace = true, optional = true }
beam_ml = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }

[lints]
workspace = true

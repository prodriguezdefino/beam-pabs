[package]
name = "apache-beam-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Core abstractions and pipeline model for Apache Beam Rust SDK"

[dependencies]
model = { workspace = true }
derive = { workspace = true, optional = true }
bytes = { workspace = true }
chrono = { workspace = true }
rust_decimal = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
clap = { workspace = true }
inventory = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
prost-types = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
foldhash = { workspace = true }

[features]
# Opt-in, mirroring `serde`'s `derive` feature.
derive = ["dep:derive"]

[dev-dependencies]
beam = { workspace = true, features = ["derive"] }
model = { workspace = true }
proptest = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }

[lints]
workspace = true

[package]
name = "apache-beam-testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "In-graph assertions (PAssert) and TestStream for testing Apache Beam Rust pipelines"

[lib]
name = "testing"

[dependencies]
beam = { package = "apache-beam-core", path = "../core", version = "2.78.0-SNAPSHOT" }
model = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
# Linked only with the `prism` feature, so that `TestPipeline` can find the Prism
# runner through the link-time registry. See the `prism` feature below.
prism = { workspace = true, optional = true }
harness = { workspace = true, optional = true }

[features]
# Links the Prism runner (and the worker harness it runs pipelines with), so that a
# crate whose only test dependency is `testing` can run a `TestPipeline` on Prism,
# the default runner of `PipelineOptions`:
#
#     [dev-dependencies]
#     testing = { workspace = true, features = ["prism"] }
#
# Not on by default: the `apache-beam` facade depends on this crate, and links no
# runner unless one is asked for.
prism = ["dep:prism", "dep:harness"]

[dev-dependencies]
# This crate's own tests run pipelines on Prism.
testing = { package = "apache-beam-testing", path = ".", features = ["prism"] }
tokio = { workspace = true }

[lints]
workspace = true

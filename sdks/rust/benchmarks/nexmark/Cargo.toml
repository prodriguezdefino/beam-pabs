[package]
name = "apache-beam-nexmark"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Nexmark benchmark suite for the Apache Beam Rust SDK"

[lib]
name = "nexmark"
path = "src/lib.rs"
test = false
doctest = false

[[bin]]
name = "nexmark"
path = "src/main.rs"
test = false

[[test]]
name = "model"
path = "tests/model/main.rs"

[[test]]
name = "generator"
path = "tests/generator/main.rs"

[[test]]
name = "queries_batch"
path = "tests/queries_batch/main.rs"

[[test]]
name = "queries_streaming"
path = "tests/queries_streaming/main.rs"

[dependencies]
beam = { workspace = true, features = ["prism", "dataflow", "gcp-gcs", "gcp-pubsub", "gcp-bigquery", "kafka", "avro", "testing"] }
chrono = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
beam_test_utils = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

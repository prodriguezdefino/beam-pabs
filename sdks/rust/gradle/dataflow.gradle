// Google Cloud Dataflow runner configuration and example launcher (`dataflow`),
// plus shared environment wiring imported by validates-runner.gradle.

ext.configureDataflowEnvironment = { Exec task ->
  def resolve = propsFor('dataflow')
  def gcpProject = gcpProjectFrom(resolve)
  def gcpTempLocation = resolve('gcpTempLocation', 'GCP_TEMP_LOCATION')
  def sdkContainerImage = resolve('sdkContainerImage', 'SDK_CONTAINER_IMAGE')
  if (!gcpProject || !gcpTempLocation || !sdkContainerImage) {
    throw new GradleException(
      "${task.name} requires gcpProject, gcpTempLocation, and sdkContainerImage. " +
      "Configure them in sdks/rust/.local/sdk.properties or pass with -P (e.g. -PgcpProject=... -PgcpTempLocation=... -PsdkContainerImage=...)"
    )
  }
  def workerBinary = resolve('workerBinary', 'WORKER_BINARY')
      ?: file("${buildDir}/linux_${workerArch}/beam-runner-tests-worker").absolutePath
  [
    BEAM_DATAFLOW_PROJECT              : gcpProject,
    BEAM_DATAFLOW_REGION               : resolve('gcpRegion', 'GCP_REGION', 'us-central1'),
    BEAM_DATAFLOW_TEMP_LOCATION        : gcpTempLocation,
    BEAM_DATAFLOW_SDK_CONTAINER_IMAGE  : sdkContainerImage,
    BEAM_DATAFLOW_WORKER_BINARY        : workerBinary,
    BEAM_DATAFLOW_NETWORK              : resolve('network', 'NETWORK'),
    BEAM_DATAFLOW_SUBNETWORK           : resolve('subnetwork', 'SUBNETWORK'),
    BEAM_DATAFLOW_SERVICE_ACCOUNT_EMAIL: resolve('serviceAccountEmail', 'SERVICE_ACCOUNT_EMAIL'),
  ].findAll { it.value }.each { name, value -> task.environment(name, value) }
}

ext.dataflowOptionTable = [
  [prop: 'subnetwork',                         env: 'SUBNETWORK',                          flag: 'subnetwork'],
  [prop: 'network',                            env: 'NETWORK',                             flag: 'network'],
  [prop: 'serviceAccountEmail',                env: 'SERVICE_ACCOUNT_EMAIL',               flag: 'service_account_email'],
  [prop: 'numWorkers',                         env: 'NUM_WORKERS',                         flag: 'num_workers'],
  [prop: 'maxNumWorkers',                      env: 'MAX_NUM_WORKERS',                     flag: 'max_num_workers'],
  [prop: 'autoscalingAlgorithm',               env: 'AUTOSCALING_ALGORITHM',               flag: 'autoscaling_algorithm'],
  [prop: 'workerMachineType',                  env: 'WORKER_MACHINE_TYPE',                 flag: 'worker_machine_type'],
  [prop: 'diskSizeGb',                         env: 'DISK_SIZE_GB',                        flag: 'disk_size_gb'],
  [prop: 'workerDiskType',                     env: 'WORKER_DISK_TYPE',                    flag: 'disk_type'],
  [prop: 'dataflowServiceOptions',             env: 'DATAFLOW_SERVICE_OPTIONS',            flag: 'dataflow_service_options'],
  [prop: 'experiments',                        env: 'EXPERIMENTS',                         flag: 'experiments'],
  [prop: 'numberOfWorkerHarnessThreads',       env: 'WORKER_HARNESS_THREADS',              flag: 'number_of_worker_harness_threads'],
  [prop: 'sdkHarnessContainerImageOverrides',  env: 'SDK_HARNESS_CONTAINER_IMAGE_OVERRIDES', flag: 'sdk_harness_container_image_overrides'],
]

// Maps a canonical snake_case Dataflow flag name to the flag name expected by `sdk`.
ext.dataflowOptionName = { String sdk, String flag ->
  if (sdk == 'java') {
    if (flag == 'service_account_email') return 'serviceAccount'
    if (flag == 'disk_type') return 'workerDiskType'
    return flag.replaceAll(/_([a-z])/) { it[1].toUpperCase() }
  }
  if (sdk == 'python') {
    if (flag == 'worker_machine_type') return 'machine_type'
    if (flag == 'disk_type') return 'worker_disk_type'
  }
  return flag
}

// Formats configured Dataflow worker and network options for `sdk` ('rust', 'python' or 'java'),
// skipping properties in `skip` when a caller sets them explicitly.
ext.dataflowOptionFlags = { Closure resolve, String sdk = 'rust', Collection<String> skip = [] ->
  def flags = []
  dataflowOptionTable.each { opt ->
    if (opt.prop in skip) return
    def val = opt.prop == 'serviceAccountEmail'
        ? (resolve('serviceAccount') ?: resolve(opt.prop, opt.env))
        : resolve(opt.prop, opt.env)
    if (val != null && !val.toString().isEmpty()) {
      flags << "--${dataflowOptionName(sdk, opt.flag)}=${val}".toString()
    }
  }
  if (!('usePublicIps' in skip) && resolve('usePublicIps', 'USE_PUBLIC_IPS')?.toString() == 'false') {
    flags << (sdk == 'java' ? '--usePublicIps=false' : '--no_use_public_ips')
  }
  flags
}

ext.buildDataflowArgs = { String example, File workerBin = null, Map opts = [:] ->
  def resolve = propsFor(example)
  def gcpProject = gcpProjectFrom(resolve)
  def gcpRegion = resolve('gcpRegion', 'GCP_REGION', 'us-central1')
  def gcpTempLocation = resolve('gcpTempLocation', 'GCP_TEMP_LOCATION')
  def sdkContainerImage = resolve('sdkContainerImage', 'SDK_CONTAINER_IMAGE')

  if (!gcpProject || !gcpTempLocation) {
    throw new GradleException("Missing required GCP parameters for example '${example}'!\n" +
      "Provide -PgcpProject=<project> and -PgcpTempLocation=gs://<bucket>/tmp on the CLI " +
      "or in sdks/rust/.local/sdk.properties (globally or under example.${example}.*).")
  }

  def supplied = suppliedWorkerBinary(example)
  def workerBinPath = supplied == 'none' ? null
      : supplied ?: (workerBin ?: workerBinaryFor(example, workerArch)).absolutePath

  def args = [
    "--runner=DataflowRunner",
    "--project=${gcpProject}",
    "--region=${gcpRegion}",
    "--temp_location=${gcpTempLocation}",
  ]
  if (workerBinPath) args << "--worker_binary=${workerBinPath}"
  if (sdkContainerImage) args << "--sdk_container_image=${sdkContainerImage}"

  args.addAll(dataflowOptionFlags(resolve, 'rust'))

  // `input` and `output` become --input and --output unless `skipIoFlags` is set. `none` passes
  // no flag, for an example that does not take it. When `output` is unset, default to a
  // timestamped path under `gcpTempLocation`.
  if (!opts.skipIoFlags) {
    def inputVal = resolve('input')?.toString()
    if (inputVal && inputVal != 'none') {
      args << "--input=${inputVal}"
    }
    def outputVal = resolve('output')?.toString()
    if (outputVal != 'none') {
      def effectiveOutput = outputVal ?: "${gcpTempLocation.toString().replaceAll('/+$', '')}/output/${example}-${System.currentTimeMillis()}/out"
      args << "--output=${effectiveOutput}"
    }
  }

  def extraArgsFile = resolve('extraArgsFile')?.toString()
  if (extraArgsFile) {
    args.addAll(file(extraArgsFile).readLines('UTF-8').findAll { !it.isEmpty() })
  }
  args.addAll(opts.extraFlags ?: [])
  def extraArgs = (resolve('extraArgs') ?: '').toString().tokenize(' ')
  args.addAll(extraArgs)

  def pkg = (opts.pkg ?: example).toString()
  def binFlags = opts.bin ? ['--bin', opts.bin.toString()] : []
  def features = (resolve('exampleFeatures') ?: '').toString().trim()
  def featureFlags = features ? ['--features', features] : []

  return ['cargo', 'run', '--release', '-p', pkg, *binFlags, *featureFlags, '--'] + args.collect { it.toString() }
}

tasks.register('dataflow', Exec) {
  group = 'Application'
  description = 'Run a Rust example on Google Cloud Dataflow (-Pexample=wordcount)'
  workingDir rustDir
  if (!suppliedWorkerBinary(selectedExample)) {
    dependsOn 'buildWorker'
  }

  doFirst {
    environment launchEnvironment()
    commandLine buildDataflowArgs(selectedExample)
  }
}

// Local CPU and memory profiles of a Rust pipeline on Prism (`profilePrism`).
//
// The task builds the binary with line tables, runs it on Prism with the LOOPBACK worker under
// samply and /usr/bin/time, and writes a summary with scripts/profiling/summary.py. It runs on
// the host only. See docs/development.md.
//
// By default it builds with the `worker` Cargo profile (fat LTO, one codegen unit), the profile
// of the binaries that run on a runner, so local profiles inline the same code as the fleet.
// -PcargoProfile=release builds faster, but its inlining differs from a worker binary.

def hostOs = System.getProperty('os.name').toLowerCase().contains('mac') ? 'darwin' : 'linux'

// The executable and source of bench `name`, from the JSON output of `cargo build --bench`.
def benchArtifact(String messages, String name) {
  def slurper = new groovy.json.JsonSlurper()
  def artifact = messages.readLines()
      .findAll { it.startsWith('{') }
      .collect { slurper.parseText(it) }
      .find { it.reason == 'compiler-artifact' && it.target?.name == name && it.executable }
  if (!artifact) {
    throw new GradleException("cargo did not build an executable for bench '${name}'.")
  }
  return [executable: artifact.executable, srcPath: artifact.target.src_path]
}

// A criterion bench takes criterion flags, not pipeline flags.
def isCriterionBench(String srcPath) {
  return srcPath && new File(srcPath).text.contains('criterion_main!')
}

def criterionProfileSeconds = 10

tasks.register('profilePrism') {
  group = 'Application'
  description = 'Profile a Rust example locally on Prism with samply and/or time (-Pexample=<name> [-Pbin=<bin> -Ppkg=<crate>] [-PcargoExample=<name> | -PcargoBench=<name>] [-PextraArgs="<pipeline flags>"] [-Prows=<n>] [-Pmode=cpu|memory|both] [-PcargoProfile=worker|release] [-Pout=<dir>]). -Pmode=both runs the pipeline two times.'

  dependsOn 'fetchPrism'

  def mode = (project.findProperty('mode') ?: 'both').toString().toLowerCase()
  // `worker` matches the binaries that run on a runner. `release` builds faster.
  def cargoProfile = (project.findProperty('cargoProfile') ?: 'worker').toString()
  if (!(cargoProfile in ['worker', 'release'])) {
    throw new GradleException("-PcargoProfile must be 'worker' or 'release', not '${cargoProfile}'.")
  }
  def profileEnv = "CARGO_PROFILE_${cargoProfile.toUpperCase()}"
  def resolve = propsFor(selectedExample)
  // A Cargo example (`--example`) or bench (`--bench`, with `harness = false`) of a workspace
  // crate, instead of a binary (`--bin`).
  def cargoExample = project.findProperty('cargoExample')?.toString()
  def cargoBench = project.findProperty('cargoBench')?.toString()
  def binArg = cargoExample ?: cargoBench ?: project.findProperty('bin') ?: selectedExample
  def pkgArg = project.findProperty('pkg') ?: selectedExample
  def rowsArg = project.findProperty('rows')
  def outArg = project.findProperty('out') ?: "${buildDir}/reports/profile/${binArg}-${System.currentTimeMillis()}"
  def outDir = file(outArg)
  def cargoTargetDir = System.getenv('CARGO_TARGET_DIR') ?: "${rustDir}/target"

  def samplyBin = file("${System.getProperty('user.home')}/.cargo/bin/samply")
  def samplyCmd = samplyBin.exists() ? samplyBin.absolutePath : 'samply'

  def extraArgs = (resolve('extraArgs') ?: '').toString().tokenize(' ')
  def features = (resolve('exampleFeatures') ?: '').toString().trim()
  def featureFlags = features ? ['--features', features] : []
  def gcpArgs = portableGcpArgs(resolve)

  doFirst {
    if (mode in ['cpu', 'both']) {
      try {
        def res = project.exec {
          commandLine samplyCmd, '--version'
          ignoreExitValue = true
        }
        if (res.exitValue != 0) {
          throw new GradleException("samply not found. Run 'cargo install --locked samply' to install it.")
        }
      } catch (Exception e) {
        throw new GradleException("samply not found. Run 'cargo install --locked samply' to install it.", e)
      }
    }
  }

  doLast {
    outDir.mkdirs()
    def profileJson = file("${outDir}/profile.json.gz")
    def timeTxt = file("${outDir}/time.txt")
    def summaryTxt = file("${outDir}/summary.md")

    println "Building binary ${binArg} in ${pkgArg} with the '${cargoProfile}' profile..."
    // The file name of a bench binary has a hash, so cargo reports its path in JSON.
    def buildOutput = new ByteArrayOutputStream()
    project.exec {
      workingDir rustDir
      environment "${profileEnv}_DEBUG", 'line-tables-only'
      environment "${profileEnv}_STRIP", 'none'
      if (hostOs == 'darwin') {
        environment "${profileEnv}_SPLIT_DEBUGINFO", 'unpacked'
      }
      def target = cargoExample ? ['--example', cargoExample] :
          cargoBench ? ['--bench', cargoBench, '--message-format=json-render-diagnostics'] :
          ['--bin', binArg]
      def cmd = ['cargo', 'build', '--profile', cargoProfile, '-p', pkgArg] + target
      if (featureFlags) { cmd += featureFlags }
      commandLine cmd
      if (cargoBench) { standardOutput = buildOutput }
    }

    def bench = cargoBench ? benchArtifact(buildOutput.toString(), cargoBench) : null
    def binPath = bench ?
        bench.executable :
        file(cargoExample ?
            "${cargoTargetDir}/${cargoProfile}/examples/${cargoExample}" :
            "${cargoTargetDir}/${cargoProfile}/${binArg}").absolutePath
    // Profile mode skips criterion's analysis. sdk.properties holds pipeline flags, so only
    // -PextraArgs applies.
    def benchArgs = (project.findProperty('extraArgs') ?: '').toString().tokenize(' ')
    def profileTime = benchArgs.any { it.startsWith('--profile-time') } ? [] :
        ['--profile-time', criterionProfileSeconds.toString()]
    def runArgs = bench && isCriterionBench(bench.srcPath) ?
        ['--bench'] + profileTime + benchArgs :
        ['--runner=PrismRunner', '--environment_type=LOOPBACK'] + gcpArgs + extraArgs
    println "Arguments: ${runArgs.join(' ')}"

    if (mode in ['cpu', 'both']) {
      println "Running CPU profile (samply)..."
      project.exec {
        workingDir rustDir
        environment launchEnvironment()
        def cmd = [samplyCmd, 'record', '--unstable-presymbolicate', '--save-only', '-o', profileJson.absolutePath, binPath] + runArgs
        commandLine cmd
      }
    }

    if (mode in ['memory', 'both']) {
      println "Running Memory profile (time)..."
      def timeCmd = hostOs == 'darwin' ? ['/usr/bin/time', '-l'] : ['/usr/bin/time', '-v']
      new FileOutputStream(file("${outDir}/time.out")).withCloseable { outStream ->
        new FileOutputStream(timeTxt).withCloseable { errStream ->
          project.exec {
            workingDir rustDir
            environment launchEnvironment()
            def cmd = timeCmd + [binPath] + runArgs
            commandLine cmd
            standardOutput = outStream
            errorOutput = errStream
          }
        }
      }
    }

    // The summary always runs: without a CPU profile it reports only the time output.
    println "Generating summary..."
    def profileArg = mode in ['cpu', 'both'] ? profileJson.absolutePath : 'none'
    def pyArgs = ['python3', "${rustDir}/scripts/profiling/summary.py", profileArg]
    if (timeTxt.exists()) {
      pyArgs += ["--time-output", timeTxt.absolutePath]
    }
    if (rowsArg) {
      pyArgs += ["--rows", rowsArg.toString()]
    }

    new FileOutputStream(summaryTxt).withCloseable { outStream ->
      project.exec {
        workingDir rustDir
        commandLine pyArgs
        standardOutput = outStream
      }
    }

    println "Outputs written to: ${outDir}"
    if (mode in ['cpu', 'both']) {
      println "To view CPU profile: samply load ${profileJson}"
    }
    println "Summary:"
    println summaryTxt.text
  }
}

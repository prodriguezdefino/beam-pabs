// Shared cross-language infrastructure: the expansion service lifecycle (`startExpansionService`,
// `stopExpansionService`, `execWithExpansionService`, `withPrismJobServer`), the Rust test
// expansion service images (`testingExpansionServiceImage`, `testingExpansionServiceDataflowImage`),
// the Python virtualenv (`setupXlangPythonEnv`), and task registration helpers shared by
// `xlang-*.gradle`, `integration.gradle`, `io-*.gradle`, and `io-benchmarks.gradle`.
//
// The suites of other SDKs run unchanged against the Rust test expansion service, which serves
// the test transforms of beam/runner-tests/src/xlang_transforms.rs. One image is both that
// service and the worker of the transforms that it expands. The service always runs on this
// machine from an image for the host architecture. It names the image that the runner starts
// as the worker: the same image for Prism, and a linux/amd64 image in a registry for Dataflow.

if (gradle.startParameter.taskNames.any { it.contains('Python') || it.contains('Xlang') }) {
  evaluationDependsOn(':sdks:python')
}

ext.xlangArch = (project.findProperty('exampleArch') ?: project.nativeArchitecture()).toString()
ext.testingImage = rustImageName('testing_expansion_service')

// Dataflow pulls the worker image for linux/amd64 from a registry, so its images have their
// own root, `dataflowRepositoryRoot`, for example us-central1-docker.pkg.dev/<project>/<repository>.
// The images of local runs keep the host architecture under the default root. The SDK base
// image must be in that registry (see validates-runner.md).
ext.xlangProps = propsFor('xlang')
ext.dataflowRoot = xlangProps('dataflowRepositoryRoot')?.toString()
ext.dataflowImage = dataflowRoot ? rustImageName('testing_expansion_service', dataflowRoot) : null

ext.requireDataflowRoot = { String root = dataflowRoot ->
  if (!root) {
    throw new GradleException('Set dataflowRepositoryRoot in sdks/rust/.local/sdk.properties or with -P.')
  }
}

// Maps each comma-separated name in `-Ptests` through `transform`, or returns `null` when
// `-Ptests` is not set.
ext.selectedTests = { Closure transform ->
  project.findProperty('tests')?.toString()?.tokenize(',')
      ?.collect { transform(it.trim()).toString() }
}

// Registers a task that builds the linux/amd64 binary of an expansion service and a task that
// bakes it into the SDK base image in `root` (by default `dataflowRoot`) and pushes it.
ext.registerDataflowExpansionImageTasks = { Map cfg ->
  def root = (cfg.containsKey('root') ? cfg.root : dataflowRoot)?.toString()
  registerExpansionImageTasks(
      buildTask: cfg.buildTask,
      imageTask: cfg.imageTask,
      pkg: cfg.pkg,
      bin: cfg.bin,
      arch: 'amd64',
      image: root ? rustImageName(cfg.imageName, root) : 'unset',
      baseImage: root ? rustImageName('sdk', root) : null,
      push: true,
      buildDescription: cfg.buildDescription,
      imageDescription: cfg.imageDescription,
  )
  tasks.named(cfg.imageTask) {
    doFirst { requireDataflowRoot(root) }
  }
}

// Registers `<sdk>SdkDataflowImage` to build and push the linux/amd64 container image of another
// SDK (`Python`, `Java`, `Go`) in this tree for Dataflow cross-language runs, and returns the
// configured `<sdk>SdkImage` property (or `null` if unset).
ext.registerSdkDataflowImageTask = { Map cfg ->
  def sdk = cfg.sdk
  def sdkLower = sdk.toLowerCase()
  def prop = "${sdkLower}SdkImage"
  def tag = (project.rootProject.findProperty('docker-tag') ?: cfg.defaultTag ?: beamSdkVersion).toString()
  def hint = cfg.extraHint ? "${cfg.extraHint} " : ''
  tasks.register("${sdkLower}SdkDataflowImage", Exec) {
    group = 'Build'
    description = "Build and push the linux/amd64 ${sdk} SDK container of this tree for the Dataflow " +
        "cross-language suite (${hint}[-PdataflowRepositoryRoot=<registry>])"
    def image = dataflowRoot ? containerImageName(
        name: "${project.docker_image_default_repo_prefix}${cfg.imageSuffix}",
        root: dataflowRoot,
        tag: tag).toString() : null
    workingDir rootDir
    commandLine(["${rootDir}/gradlew", cfg.gradleTask,
                 '-Pcontainer-architecture-list=amd64',
                 "-Pdocker-repository-root=${dataflowRoot}",
                 '-Ppush-containers'] + (cfg.extraArgs ?: []))
    doFirst { requireDataflowRoot() }
    doLast {
      logger.lifecycle("Pushed ${image}. Set example.xlang.${prop}=${image} in sdks/rust/.local/sdk.properties.")
    }
  }
  xlangProps(prop)?.toString()
}

// Registers `validatesCrossLanguageRunner<Sdk>Prism` and `validatesCrossLanguageRunner<Sdk>Dataflow`
// with shared descriptions and dependencies.
ext.registerXlangSuiteTasks = { Map cfg ->
  def sdk = cfg.sdk
  def type = cfg.taskType ?: DefaultTask
  def commonDeps = ['testingExpansionServiceImage'] + (cfg.dependsOn ?: [])
  def hints = { String extra ->
    (["[-Ptests=${cfg.testExamples}]"] + (extra ? [extra] : [])).join(' ')
  }

  tasks.register("validatesCrossLanguageRunner${sdk}Prism", type) {
    group = 'Verification'
    description = "Run the ${sdk} cross-language suite against the Rust test expansion service on Prism (${hints(cfg.prismHint)})"
    dependsOn(commonDeps + ['fetchPrism'] + (cfg.prismDependsOn ?: []))
    cfg.configurePrism(it)
  }

  tasks.register("validatesCrossLanguageRunner${sdk}Dataflow", type) {
    group = 'Verification'
    description = "Run the ${sdk} cross-language suite against the Rust test expansion service on Dataflow (${hints(cfg.dataflowHint)})"
    dependsOn(commonDeps + ['testingExpansionServiceDataflowImage'] + (cfg.dataflowDependsOn ?: []))
    cfg.configureDataflow(it)
  }
}

// Builds the Dataflow pipeline flags for a cross-language suite from `xlangProps`.
// `cfg` may override `runner` ('TestDataflowRunner'), `tempFlag` ('temp_location'),
// `tempSuffix` (''), `numWorkersFlag` ('num_workers'), `machineTypeFlag` ('machine_type'),
// and supply `extraFlags` (a List or a Closure taking `gcpTempLocation`).
ext.xlangDataflowFlags = { Map cfg = [:] ->
  def gcpProject = gcpProjectFrom(xlangProps)
  def gcpTempLocation = xlangProps('gcpTempLocation', 'GCP_TEMP_LOCATION')
  if (!gcpProject || !gcpTempLocation) {
    throw new GradleException('Set gcpProject and gcpTempLocation in sdks/rust/.local/sdk.properties or with -P.')
  }
  def region = xlangProps('gcpRegion', 'GCP_REGION', 'us-central1')
  def runner = cfg.runner ?: 'TestDataflowRunner'
  def tempFlag = cfg.tempFlag ?: 'temp_location'
  def tempSuffix = cfg.tempSuffix ?: ''
  def numWorkersFlag = cfg.numWorkersFlag ?: 'num_workers'
  def machineTypeFlag = cfg.machineTypeFlag ?: 'machine_type'
  def extra = cfg.extraFlags instanceof Closure ? cfg.extraFlags(gcpTempLocation) : (cfg.extraFlags ?: [])

  def opts = [
    "--runner=${runner}",
    "--project=${gcpProject}",
    "--region=${region}",
    "--${tempFlag}=${gcpTempLocation}${tempSuffix}",
    "--${numWorkersFlag}=1",
  ] + extra
  ['network', 'subnetwork'].each { key ->
    def value = xlangProps(key)
    if (value) {
      opts << "--${key}=${value}"
    }
  }
  def machineType = xlangProps('workerMachineType')
  if (machineType) {
    opts << "--${machineTypeFlag}=${machineType}"
  }
  opts*.toString()
}

registerExpansionImageTasks(
    buildTask: 'buildTestingExpansionService',
    imageTask: 'testingExpansionServiceImage',
    pkg: 'apache-beam-runner-tests',
    bin: 'beam-runner-tests-expansion-service',
    arch: xlangArch,
    image: testingImage,
    buildDescription: 'Build the Linux test expansion service binary of the cross-language suites ([-PexampleArch=<arch>])',
    imageDescription: 'Build the test expansion service image of the cross-language suites, beam_rust_testing_expansion_service ([-PexampleArch=<arch>])',
)

registerDataflowExpansionImageTasks(
    buildTask: 'buildTestingExpansionServiceDataflow',
    imageTask: 'testingExpansionServiceDataflowImage',
    pkg: 'apache-beam-runner-tests',
    bin: 'beam-runner-tests-expansion-service',
    imageName: 'testing_expansion_service',
    buildDescription: 'Build the linux/amd64 test expansion service binary for Dataflow',
    imageDescription: 'Build and push the linux/amd64 test expansion service image for Dataflow ([-PdataflowRepositoryRoot=<registry>])',
)

ext.waitForPort = { int port, int timeoutSeconds ->
  def deadline = System.currentTimeMillis() + timeoutSeconds * 1000L
  while (System.currentTimeMillis() < deadline) {
    try {
      new Socket('localhost', port).close()
      return
    } catch (IOException ignored) {
      sleep(500)
    }
  }
  throw new GradleException("The expansion service did not open port ${port} in ${timeoutSeconds} s.")
}

// Starts the expansion service of `image` on a free port of this machine, and returns its
// port and container. The service names `workerImage` (by default `image`) as the worker.
// `platform` selects the platform of the image. With `credentials`, the service gets the
// Application Default Credentials of this machine, for providers that call a cloud service
// when they expand.
ext.startExpansionService = { Map cfg ->
  def image = cfg.image ?: testingImage
  def port = new ServerSocket(0).withCloseable { it.localPort }
  def container = "beam-rust-expansion-${port}"
  def command = ['docker', 'run', '-d', '--rm', '--name', container, '-p', "${port}:8097"]
  if (cfg.platform) {
    command += ['--platform', cfg.platform]
  }
  if (cfg.credentials) {
    command += ['-v', "${cfg.credentials}:/creds.json:ro", '-e', 'GOOGLE_APPLICATION_CREDENTIALS=/creds.json']
  }
  command += ['--entrypoint', '/opt/apache/beam/worker_binary', image,
              '--port', '8097', '--docker-image', cfg.workerImage ?: image]
  project.exec { commandLine command*.toString() }
  def service = [port: port, container: container]
  try {
    waitForPort(port, 60)
  } catch (GradleException e) {
    stopExpansionService(service)
    throw e
  }
  service
}

ext.stopExpansionService = { Map service ->
  project.exec {
    commandLine 'docker', 'rm', '-f', service.container
    ignoreExitValue = true
    standardOutput = new ByteArrayOutputStream()
  }
}

// Starts an expansion service with `cfg`, runs `project.exec` configured by `configureExec(service)`
// with `DOCKER_HOST` set when needed, and stops the container when `exec` finishes.
ext.execWithExpansionService = { Map cfg = [:], Closure configureExec ->
  def service = startExpansionService(cfg)
  try {
    def host = dockerHost()
    project.exec {
      if (host) {
        environment 'DOCKER_HOST', host
      }
      configureExec.delegate = delegate
      configureExec.resolveStrategy = Closure.DELEGATE_FIRST
      configureExec(service)
    }
  } finally {
    stopExpansionService(service)
  }
}

// Starts the host-native Prism job server on a free port, runs `body(jobPort)`, and stops the
// server when `body` returns.
ext.withPrismJobServer = { Closure body ->
  def jobPort = new ServerSocket(0).withCloseable { it.localPort }
  def pb = new ProcessBuilder(
      prismHostBinary.absolutePath, '--serve_http=false', "--job_port=${jobPort}", '--idle_shutdown_timeout=0s'
  ).inheritIO()
  def host = dockerHost()
  if (host) {
    pb.environment().put('DOCKER_HOST', host)
  }
  def prismProcess = pb.start()
  try {
    waitForPort(jobPort, 30)
    body(jobPort)
  } finally {
    prismProcess.destroy()
  }
}

ext.pythonDir = file("${rootDir}/sdks/python")
ext.pythonSdist = file("${pythonDir}/build/apache-beam.tar.gz")
ext.xlangVenv = file("${buildDir}/xlang-venv")
def venvExtras = 'gcp,test'
def venvStamp = file("${xlangVenv}/beam-extras")

// The suite needs only the SDK of this tree with the gcp and test extras, so the virtualenv
// skips the other extras of :sdks:python:installGcpTest. The suite imports apache_beam from
// sdks/python, so the virtualenv only supplies dependencies and is built once.
def refreshVenv = !venvStamp.exists() || venvStamp.text.trim() != venvExtras ||
    project.hasProperty('refreshXlangPythonEnv')
tasks.register('setupXlangPythonEnv') {
  group = 'Build'
  description = 'Create a virtualenv with the Python SDK of this tree for the cross-language suites ([-PpythonVersion=3.12] [-PrefreshXlangPythonEnv])'
  onlyIf { refreshVenv }
  if (refreshVenv) {
    dependsOn ':sdks:python:sdist'
  }

  doLast {
    def interpreter = "python${project.findProperty('pythonVersion') ?: '3'}"
    project.delete xlangVenv
    project.exec { commandLine interpreter, '-m', 'venv', xlangVenv.absolutePath }
    project.exec {
      commandLine "${xlangVenv}/bin/pip", 'install', '--quiet', "${pythonSdist}[${venvExtras}]"
    }
    venvStamp.text = venvExtras
  }
}

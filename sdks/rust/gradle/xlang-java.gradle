// Java cross-language ValidatesRunner tasks (`validatesCrossLanguageRunnerJavaPrism`,
// `validatesCrossLanguageRunnerJavaDataflow`, `javaSdkDataflowImage`).

if (gradle.startParameter.taskNames.any { it.contains('CrossLanguageRunnerJava') }) {
  evaluationDependsOn(':sdks:java:core')
  evaluationDependsOn(':sdks:java:extensions:python')
  evaluationDependsOn(':runners:prism:java')
  evaluationDependsOn(':runners:google-cloud-dataflow-java')
}

def javaXlangClass = 'org.apache.beam.sdk.util.construction.ValidateRunnerXlangTest'
def imageJavaVersion = (project.findProperty('testJavaVersion')?.with {
  org.apache.beam.gradle.BeamModulePlugin.getSupportedJavaVersion(it.toString())
} ?: project.ext.currentJavaVersion).toString()

def javaSdkImage = registerSdkDataflowImageTask(
    sdk: 'Java',
    imageSuffix: "${imageJavaVersion}_sdk",
    gradleTask: ":sdks:java:container:${imageJavaVersion}:docker",
)

def configureJavaXlangTest = { Test task, String runnerProject, String workerImage, Closure<List<String>> pipelineOpts ->
  def service = null
  String testJavaVersion = project.findProperty('testJavaVersion')
  String testJavaHome = testJavaVersion ? project.findProperty("java${testJavaVersion}Home") : null

  task.outputs.upToDateWhen { false }
  task.binaryResultsDirectory = file("${buildDir}/test-results/${task.name}/binary")
  task.reports.html.outputLocation = file("${buildDir}/reports/tests/${task.name}")
  task.reports.junitXml.outputLocation = file("${buildDir}/test-results/${task.name}")
  task.classpath = project.files({
    project.project(runnerProject).configurations.validatesRunner + project.files(
        project.project(':sdks:java:core').sourceSets.test.runtimeClasspath,
        project.project(':sdks:java:extensions:python').sourceSets.test.runtimeClasspath,
    )
  })
  task.testClassesDirs = project.files({
    [
        project.project(':sdks:java:core').sourceSets.test.output.classesDirs,
        project.project(':sdks:java:extensions:python').sourceSets.test.output.classesDirs,
    ]
  })
  task.useJUnit {
    includeCategories 'org.apache.beam.sdk.testing.UsesJavaExpansionService'
  }
  task.filter {
    (selectedTests { "${javaXlangClass}\$${it}" } ?: ["${javaXlangClass}\$*"]).each {
      includeTestsMatching it
    }
  }
  if (testJavaHome) {
    task.executable = "${testJavaHome}/bin/java"
  }
  task.maxHeapSize = '4g'

  task.doFirst {
    def host = dockerHost()
    if (host) {
      task.environment 'DOCKER_HOST', host
    }
    service = startExpansionService(workerImage: workerImage)
    task.systemProperty 'expansionPort', service.port
    task.systemProperty 'expansionJar', ''
    task.systemProperty 'beamTestPipelineOptions', groovy.json.JsonOutput.toJson(pipelineOpts())
  }
  task.doLast {
    if (service) {
      stopExpansionService(service)
    }
  }
}

registerXlangSuiteTasks(
    sdk: 'Java',
    taskType: Test,
    testExamples: 'SingleInputOutputTest,GroupByKeyTest',
    dataflowDependsOn: [':runners:google-cloud-dataflow-java:worker:shadowJar'],
    dataflowHint: '[-PxlangParallelism=8] [-PjavaSdkImage=<image>]',
    configurePrism: { Test task ->
      task.maxParallelForks = 1
      configureJavaXlangTest(task, ':runners:prism:java', testingImage) {
        [
          '--runner=TestPrismRunner',
          '--experiments=beam_fn_api',
          '--defaultEnvironmentType=LOOPBACK',
          '--prismLogLevel=warn',
          "--prismLocation=${prismHostBinary.absolutePath}",
          '--enableWebUI=false',
        ]*.toString()
      }
    },
    configureDataflow: { Test task ->
      task.maxParallelForks = (project.findProperty('xlangParallelism') ?: '8').toInteger()
      configureJavaXlangTest(task, ':runners:google-cloud-dataflow-java', dataflowImage) {
        xlangDataflowFlags(
            tempFlag: 'tempRoot',
            numWorkersFlag: 'numWorkers',
            machineTypeFlag: 'workerMachineType',
            extraFlags: javaSdkImage ? ["--sdkContainerImage=${javaSdkImage}"] : [],
        )
      }
    },
)

// The Rust suite of beam/runner-tests/tests/xlang against the Java test expansion service.
// The service runs on the JVM of Gradle and names the Java SDK image of that JVM version as
// the environment of its transforms. Prism starts that image, so it must exist locally.
def javaTestServiceProject = ':sdks:java:testing:expansion-service'
def javaMajor = JavaVersion.current().majorVersion
def localJavaSdkImage = "${project.docker_image_default_repo_root}/" +
    "${project.docker_image_default_repo_prefix}java${javaMajor}_sdk:${beamSdkVersion}"

def dockerReachable = { ->
  project.exec {
    commandLine 'docker', 'info'
    standardOutput = new ByteArrayOutputStream()
    errorOutput = new ByteArrayOutputStream()
    ignoreExitValue = true
  }.exitValue == 0
}

def imageExists = { String image ->
  project.exec {
    commandLine 'docker', 'image', 'inspect', image
    standardOutput = new ByteArrayOutputStream()
    errorOutput = new ByteArrayOutputStream()
    ignoreExitValue = true
  }.exitValue == 0
}

tasks.register('validatesCrossLanguageRunnerJavaServicePrism') {
  group = 'Verification'
  description = 'Run the Rust cross-language suite against the Java test expansion service on Prism ' +
      '([-Pfilter=<test name>] [-PtestThreads=<n>] [-PincludeIgnored] [-PbuildJavaContainer])'
  dependsOn "${javaTestServiceProject}:buildTestExpansionServiceJar", 'fetchPrism'
  if (project.hasProperty('buildJavaContainer')) {
    dependsOn ":sdks:java:container:java${javaMajor}:docker"
  }

  doLast {
    if (!dockerReachable()) {
      throw new GradleException("Docker is not reachable. The cross-language suite needs it to start " +
          "the Java SDK container.")
    }
    if (!imageExists(localJavaSdkImage)) {
      throw new GradleException("${localJavaSdkImage} is not available locally. Build it with " +
          "./gradlew :sdks:java:container:java${javaMajor}:docker, or add -PbuildJavaContainer.")
    }
    def jar = project.project(javaTestServiceProject).tasks
        .named('buildTestExpansionServiceJar').get().archiveFile.get().asFile
    def port = new ServerSocket(0).withCloseable { it.localPort }
    def log = file("${buildDir}/xlang-java-test-expansion-service.log")
    log.parentFile.mkdirs()
    def java = "${System.getProperty('java.home')}/bin/java"
    def service = new ProcessBuilder(java, '-jar', jar.absolutePath, port.toString())
        .redirectErrorStream(true)
        .redirectOutput(log)
        .start()
    try {
      waitForPort(port, 120)
      def filters = project.findProperty('filter')?.toString()?.tokenize() ?: []
      def threads = project.findProperty('testThreads')?.toString()
      def testArgs = filters + [threads ? "--test-threads=${threads}".toString() : null,
                                project.hasProperty('includeIgnored') ? '--include-ignored' : null].findAll { it }
      project.exec {
        workingDir rustDir
        environment 'BEAM_JAVA_TEST_EXPANSION_ADDR', "localhost:${port}"
        environment 'BEAM_PRISM_PATH', prismHostBinary.absolutePath
        commandLine(['cargo', 'test', '-p', 'apache-beam-runner-tests', '--test', 'xlang'] +
            (testArgs ? ['--'] + testArgs : []))
      }
    } finally {
      service.destroy()
      service.waitFor()
      logger.lifecycle("Java test expansion service log: ${log}")
    }
  }
}

// Tasks of the Kafka connector of the Rust SDK (apache-beam-io-kafka): the expansion service
// images, the Python tests on Prism, and the local copy throughput bench (`kafkaCopyBenchmark`).

registerExpansionImageTasks(
    buildTask: 'buildKafkaExpansionService',
    imageTask: 'kafkaExpansionServiceImage',
    pkg: 'apache-beam-io-kafka-expansion-service',
    bin: 'beam-kafka-expansion-service',
    arch: workerArch,
    image: rustImageName('kafka_expansion_service'),
    buildDescription: 'Build the Linux expansion service binary of the Kafka connector of the Rust SDK (-PexampleArch=amd64)',
    imageDescription: 'Build the expansion service image of the Kafka connector of the Rust SDK, beam_rust_kafka_expansion_service ([-PbaseImage=<image>] [-PexampleArch=amd64] [-Ppush-containers])',
)

registerDataflowExpansionImageTasks(
    buildTask: 'buildKafkaExpansionServiceDataflow',
    imageTask: 'kafkaExpansionServiceDataflowImage',
    pkg: 'apache-beam-io-kafka-expansion-service',
    bin: 'beam-kafka-expansion-service',
    imageName: 'kafka_expansion_service',
    root: connectorDataflowRoot,
    buildDescription: 'Build the linux/amd64 expansion service binary of the Kafka connector for Dataflow',
    imageDescription: 'Build and push the linux/amd64 beam_rust_kafka_expansion_service image for Dataflow ([-PdataflowRepositoryRoot=<registry>])',
)

// Python tests of the Kafka expansion service. Each test module starts a single-node broker in
// Docker with testcontainers, which the test extras of the Python SDK install. Prism starts the
// Rust worker with host networking, so the worker reaches the broker on its localhost port.
// The tests need no Google credentials.
def kafkaTestingImage = rustImageName('kafka_expansion_service_testing')
def kafkaTestsDir = file("${rustDir}/beam/io/kafka/expansion-service/tests/python")

registerExpansionImageTasks(
    buildTask: 'buildKafkaExpansionServiceTesting',
    imageTask: 'kafkaExpansionServiceTestingImage',
    pkg: 'apache-beam-io-kafka-expansion-service',
    bin: 'beam-kafka-expansion-service',
    arch: xlangArch,
    image: kafkaTestingImage,
    buildDescription: 'Build the Linux expansion service binary of the Kafka connector of the Rust SDK for its Python tests ([-PexampleArch=<arch>])',
    imageDescription: 'Build the image of the Kafka connector of the Rust SDK for its Python tests, beam_rust_kafka_expansion_service_testing ([-PexampleArch=<arch>])',
)

tasks.register('kafkaExpansionServicePythonTest') {
  group = 'Verification'
  description = 'Run the Python tests of the Rust Kafka providers on Prism, against a local broker ' +
      'in Docker ([-Ptests=kafka] [-PtestFilter=<pytest -k>] [-PpythonVersion=3.12])'
  dependsOn 'kafkaExpansionServiceTestingImage', 'fetchPrism', 'setupXlangPythonEnv'

  doLast {
    // testcontainers mounts the Docker socket into its reaper container. DOCKER_HOST can name a
    // path of this machine (Colima), which the Docker VM cannot mount, so name the VM socket.
    def socket = System.getenv('TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE') ?: '/var/run/docker.sock'
    runProviderPythonTests(kafkaTestingImage, kafkaTestsDir,
        [TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE: socket], null, false)
  }
}

def portOpen = { String host, int port ->
  try {
    new Socket(host, port).close()
    return true
  } catch (IOException ignored) {
    return false
  }
}

def waitForKafkaContainer = { String container, int timeoutSeconds ->
  def host = dockerHost()
  def deadline = System.currentTimeMillis() + timeoutSeconds * 1000L
  while (System.currentTimeMillis() < deadline) {
    def out = new ByteArrayOutputStream()
    project.exec {
      if (host) environment 'DOCKER_HOST', host
      commandLine 'docker', 'logs', container
      standardOutput = out
      errorOutput = out
      ignoreExitValue = true
    }
    if (out.toString().contains('Kafka Server started')) {
      return
    }
    sleep(500)
  }
  throw new GradleException("Kafka container ${container} did not start within ${timeoutSeconds} s.")
}

tasks.register('kafkaCopyBenchmark') {
  group = 'Verification'
  description = 'Run the local Kafka copy throughput bench on Prism; starts a Docker broker when none listens on localhost:9092 ' +
      '([-Precords=1000000] [-Pruns=3] [-Pformats=bytes,json] [-Ppartitions=16] [-PbootstrapServers=localhost:9092] ' +
      '[-PcargoProfile=worker] [-PextraArgs=<flags>])'
  dependsOn 'fetchPrism'

  doLast {
    def host = dockerHost()
    def servers = project.findProperty('bootstrapServers')?.toString()
    def container = null
    if (!servers) {
      if (portOpen('localhost', 9092)) {
        servers = 'localhost:9092'
      } else if (dockerReachable()) {
        def port = new ServerSocket(0).withCloseable { it.localPort }
        container = "beam-kafka-bench-${port}"
        servers = "localhost:${port}"
        project.exec {
          if (host) environment 'DOCKER_HOST', host
          commandLine 'docker', 'run', '-d', '--rm', '--name', container, '-p', "${port}:9092",
              '-e', 'KAFKA_NODE_ID=1',
              '-e', 'KAFKA_PROCESS_ROLES=broker,controller',
              '-e', 'KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093',
              '-e', "KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://${servers}",
              '-e', 'KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER',
              '-e', 'KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT',
              '-e', 'KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093',
              '-e', 'KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1',
              'apache/kafka:3.9.0'
        }
        try {
          waitForKafkaContainer(container, 60)
        } catch (Exception e) {
          project.exec {
            if (host) environment 'DOCKER_HOST', host
            commandLine 'docker', 'rm', '-f', container
            ignoreExitValue = true
            standardOutput = new ByteArrayOutputStream()
          }
          throw e
        }
      } else {
        servers = 'localhost:9092'
      }
    }
    try {
      def benchArgs = ["--bootstrap_servers=${servers}"]
      ['records': 'records', 'runs': 'runs', 'formats': 'formats', 'partitions': 'partitions'].each { prop, flag ->
        def val = project.findProperty(prop)?.toString()
        if (val) benchArgs << "--${flag}=${val}"
      }
      benchArgs.addAll(project.findProperty('extraArgs')?.toString()?.tokenize(' ') ?: [])
      // The `worker` profile has the inlining of the binaries that run on a runner.
      def cargoProfile = (project.findProperty('cargoProfile') ?: 'worker').toString()
      println "kafkaCopyBenchmark: Cargo profile ${cargoProfile}"
      project.exec {
        workingDir rustDir
        environment launchEnvironment()
        commandLine((['cargo', 'bench', '-p', 'apache-beam-io-kafka', '--profile', cargoProfile] +
            ['--bench', 'copy_throughput', '--'] + benchArgs)*.toString())
      }
    } finally {
      if (container) {
        project.exec {
          if (host) environment 'DOCKER_HOST', host
          commandLine 'docker', 'rm', '-f', container
          ignoreExitValue = true
          standardOutput = new ByteArrayOutputStream()
        }
      }
    }
  }
}

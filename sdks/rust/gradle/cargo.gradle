import javax.inject.Inject
import org.gradle.workers.WorkerExecutor

// Shared cargo settings: the workspace directory, the cargo environment, the crate scope of
// -Ppkg and -PonlyFeatures, and `cargoTask`. workspace.gradle, lint.gradle and tests.gradle
// use them.

abstract class RustWorkerAccess {
  @Inject
  RustWorkerAccess() {}

  @Inject
  abstract WorkerExecutor getWorkerExecutor()
}

ext.rustDir = file("${rootDir}/sdks/rust")
ext.rustWorkerExecutor = project.objects.newInstance(RustWorkerAccess).workerExecutor
ext.beamCargoEnv = [
    BEAM_SDK_VERSION    : beamSdkVersion.toString(),
    BEAM_RELEASE_VERSION: beamReleaseVersion.toString(),
    BEAM_VERSION        : beamVersion.toString(),
]

// The benchmark pipelines under scripts/benchmarks. The lifecycle tasks leave them out, so
// every build does not compile them. `checkBenchmarks` and the benchmark tasks build them.
ext.benchmarkPackages = ['bigtable_benchmark', 'kafka_benchmark']
ext.workspaceScope = ['--workspace'] + benchmarkPackages.collectMany { ['--exclude', it] }

// -Ppkg=<crate> narrows `build` and `test` to one crate; the default is the workspace but the
// benchmarks. With -Ppkg, -PonlyFeatures=<list> enables only these cargo features of the crate.
ext.selectedPkg = (project.findProperty('pkg') ?: project.findProperty('package'))?.toString()
ext.onlyFeatures = project.findProperty('onlyFeatures')?.toString()
ext.featureScope = selectedPkg && onlyFeatures != null ?
    ['--no-default-features', '--features', onlyFeatures] : []
ext.cargoScope = (selectedPkg ? ['-p', selectedPkg] : workspaceScope) + featureScope

ext.modelProtoDirs = [
    file("${rootDir}/model/pipeline/src/main/proto"),
    file("${rootDir}/model/fn-execution/src/main/proto"),
    file("${rootDir}/model/job-management/src/main/proto"),
]
ext.workspaceRootFiles = [
    file("${rustDir}/Cargo.toml"),
    file("${rustDir}/Cargo.lock"),
    file("${rootDir}/gradle.properties"),
]

// Registers an Exec task that runs `cargo <args>` in the workspace root.
ext.cargoTask = { String name, String taskGroup, String text, List<String> args ->
  tasks.register(name, Exec) {
    group = taskGroup
    description = text
    workingDir rustDir
    commandLine(['cargo'] + args)
  }
}

cargoTask('cleanSdk', 'Build', 'Remove the cargo target directory',
    ['clean'])
clean.dependsOn 'cleanSdk'

// Lifecycle tasks: build, check (rustfmt + clippy), test, fmt and clean.
//
// The tasks always run cargo. Cargo has its own incremental build, so a run with nothing to
// do is fast, and its result is always the real result of the command.

ext.rustDir = file("${rootDir}/sdks/rust")

// The benchmark pipelines under scripts/benchmarks. The lifecycle tasks leave them out, so
// every build does not compile them. `checkBenchmarks` and the benchmark tasks build them.
ext.benchmarkPackages = ['kafka_benchmark']
def workspaceScope = ['--workspace'] + benchmarkPackages.collectMany { ['--exclude', it] }

// -Ppkg=<crate> narrows `test` to one crate; the default is the workspace but the benchmarks.
def selectedPkg = (project.findProperty('pkg') ?: project.findProperty('package'))?.toString()
ext.cargoScope = selectedPkg ? ['-p', selectedPkg] : workspaceScope
// -PtestArgs="<args>" passes test-binary arguments after `--`, e.g. -PtestArgs=--ignored.
def testArgs = project.findProperty('testArgs')?.toString()?.tokenize(' ') ?: []

// Registers an Exec task that runs `cargo <args>` in the workspace root.
ext.cargoTask = { String name, String taskGroup, String text, List<String> args ->
  tasks.register(name, Exec) {
    group = taskGroup
    description = text
    workingDir rustDir
    commandLine(['cargo'] + args)
  }
}

cargoTask('buildWorkspace', 'Build', 'Compile all crates in the Rust workspace but the benchmarks',
    ['build'] + workspaceScope)
cargoTask('fmtCheck', 'Verification', 'Verify formatting (cargo fmt --check)',
    ['fmt', '--check'])
cargoTask('fmt', 'Verification', 'Format all Rust code (cargo fmt)',
    ['fmt'])
cargoTask('clippy', 'Verification', 'Run clippy on all targets but the benchmarks (-D warnings)',
    ['clippy'] + workspaceScope + ['--all-targets', '--', '-D', 'warnings'])
def benchmarkScope = benchmarkPackages.collectMany { ['-p', it] }
cargoTask('clippyBenchmarks', 'Verification', 'Run clippy on the benchmark pipelines (-D warnings)',
    ['clippy'] + benchmarkScope + ['--all-targets', '--', '-D', 'warnings'])
cargoTask('testBenchmarks', 'Verification', 'Run the tests of the benchmark pipelines',
    ['test'] + benchmarkScope)
tasks.register('checkBenchmarks') {
  group = 'Verification'
  description = 'Run clippy and the tests of the benchmark pipelines'
  dependsOn 'clippyBenchmarks', 'testBenchmarks'
}
cargoTask('test', 'Verification',
    'Run tests (the workspace, or one crate with -Ppkg=<crate>; -PtestArgs=<args> after --)',
    ['test'] + cargoScope + (testArgs ? ['--'] + testArgs : []))
cargoTask('cleanSdk', 'Build', 'Remove the cargo target directory',
    ['clean'])

build.dependsOn 'buildWorkspace'
check.dependsOn 'fmtCheck', 'clippy'
clean.dependsOn 'cleanSdk'

// Some crates test against Java expansion services that start from the JARs of this Beam
// build (build/libs/<artifact>-<version>.jar). `test` builds the JARs of the crates it runs.
def testExpansionServiceJars = [
    'apache-beam-external': ':sdks:java:io:google-cloud-platform:expansion-service:shadowJar',
    'apache-beam-runner-tests': ':sdks:java:io:expansion-service:shadowJar',
]
testExpansionServiceJars.each { pkg, jar ->
  if (!selectedPkg || selectedPkg == pkg) {
    tasks.named('test') { dependsOn jar }
  }
}

// Integration tests of the I/O connectors against real services (`bigQueryIntegrationTest`).
//
// The tests carry #[ignore], so `cargo test` and `:sdks:rust:test` never call these services.
// Each task runs one test binary with --ignored. BEAM_TEST_PIPELINE_OPTIONS holds the runner
// and the project to bill, from sdks/rust/.local/sdk.properties (gcpProject) or -P.

tasks.register('bigQueryIntegrationTest', Exec) {
  group = 'Verification'
  description = 'Read public BigQuery tables with the native Storage Read connector on Prism ([-PgcpProject=<project>])'
  dependsOn 'fetchPrism'
  workingDir rustDir

  doFirst {
    def gcpProject = gcpProjectFrom(propsFor('it'))
    if (!gcpProject) {
      throw new GradleException('Set gcpProject in sdks/rust/.local/sdk.properties or with -P.')
    }
    environment launchEnvironment()
    environment 'BEAM_TEST_PIPELINE_OPTIONS', "--runner=prism --project=${gcpProject}"
  }
  commandLine 'cargo', 'test', '-p', 'apache-beam-runner-tests', '--test', 'bigquery_storage_it', '--', '--ignored'
}

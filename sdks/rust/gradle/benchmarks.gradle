// Shared Dataflow benchmark harness.
//
// scripts/benchmarks holds one directory for each benchmark. Each directory has
// benchmark.gradle, one pipeline for each SDK (python/, java/), and tools/ holds
// scripts that all benchmarks share (job_metrics.py prints the result tables).
//
// This script sets up the released Python and Java SDKs (-PbenchmarkBeamVersion),
// builds the expansion service image for Dataflow, and provides registerDataflowBenchmark
// to the benchmark.gradle files under scripts/benchmarks/.

ext.benchProps = propsFor('benchmark')
ext.benchRoot = benchProps('dataflowRepositoryRoot')?.toString()
ext.benchVenv = file("${buildDir}/bench-venv")
ext.benchBeamVersion = (project.findProperty('benchmarkBeamVersion') ?: '2.76.0').toString()
ext.benchPipeline = (project.findProperty('pipeline') ?: 'python').toString()
ext.benchReader = (project.findProperty('reader') ?: 'rust').toString()
ext.benchWriter = project.findProperty('writer')?.toString()
def benchStamp = file("${benchVenv}/beam-version")

registerDataflowExpansionImageTasks(
    buildTask: 'buildGcpExpansionServiceDataflow',
    imageTask: 'gcpExpansionServiceDataflowImage',
    pkg: 'apache-beam-io-gcp-expansion-service',
    bin: 'beam-gcp-expansion-service',
    imageName: 'gcp_expansion_service',
    root: benchRoot,
    buildDescription: 'Build the linux/amd64 expansion service binary of the native Google Cloud connectors for Dataflow',
    imageDescription: 'Build and push the linux/amd64 beam_rust_gcp_expansion_service image for Dataflow ([-PdataflowRepositoryRoot=<registry>])',
)

def refreshBenchVenv = !benchStamp.exists() || benchStamp.text.trim() != benchBeamVersion
tasks.register('setupBenchmarkPythonEnv') {
  group = 'Build'
  description = 'Create a virtualenv with a released Python SDK for the Dataflow benchmarks ([-PbenchmarkBeamVersion=2.76.0] [-PpythonVersion=3.12])'
  onlyIf { refreshBenchVenv }

  doLast {
    def interpreter = "python${project.findProperty('pythonVersion') ?: '3.12'}"
    project.delete benchVenv
    project.exec { commandLine interpreter, '-m', 'venv', benchVenv.absolutePath }
    project.exec {
      commandLine "${benchVenv}/bin/pip", 'install', '--quiet', "apache-beam[gcp]==${benchBeamVersion}"
    }
    benchStamp.text = benchBeamVersion
  }
}

// Java benchmarks build against released artifacts from Maven, not against this tree.
// Nothing outside sdks/rust is needed.
configurations {
  // The java plugin is not applied here. Request the runtime jars of a standard JVM,
  // matching runtimeClasspath (for example, the jre variant of Guava).
  javaBenchmark {
    canBeConsumed = false
    attributes {
      attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
      attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
      attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE,
          objects.named(LibraryElements, LibraryElements.JAR))
      attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
      attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
          objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
    }
  }
}
dependencies {
  ['beam-sdks-java-core', 'beam-sdks-java-managed', 'beam-sdks-java-io-google-cloud-platform',
   'beam-runners-google-cloud-dataflow-java'].each {
    javaBenchmark "org.apache.beam:${it}:${benchBeamVersion}"
  }
  // BigQueryStorageArrowReader needs an Arrow buffer allocator on the worker classpath.
  javaBenchmark 'org.apache.arrow:arrow-memory-netty:17.0.0'
  // PAssert (the row check) needs JUnit and Hamcrest at run time.
  javaBenchmark 'junit:junit:4.13.2'
  javaBenchmark 'org.hamcrest:hamcrest:2.1'
  javaBenchmark 'org.slf4j:slf4j-jdk14:2.0.16'
}

// Starts the expansion service from the linux/amd64 worker image. One image serves both
// roles, and Application Default Credentials let providers read cloud metadata at expansion.
ext.startGcpExpansionService = { String image ->
  def credentials = googleCredentials()
  if (!credentials) {
    throw new GradleException('No Application Default Credentials. Run gcloud auth application-default login.')
  }
  startExpansionService(image: image, platform: 'linux/amd64', credentials: credentials)
}

// Formats a flag name for the selected pipeline: snake_case for Python, lowerCamelCase for Java.
ext.benchFlag = { String name ->
  def flag = benchPipeline == 'java' ? name.replaceAll(/_([a-z])/) { it[1].toUpperCase() } : name
  return "--${flag}"
}

// Registers a Dataflow benchmark task and its Java compile task for scripts/benchmarks/<dir>/.
// -Preader selects the reader (`cfg.readers`, for each pipeline). The shapes in
// `cfg.writeShapes` also write, and -Pwriter selects the writer (`cfg.writers`). The other
// shapes reject -Pwriter. `cfg.configure`, if set, gets [shape:, writes:] and returns the spec
// of the job (readerLabel, jobSuffix, labels, args). `cfg.afterRun`, if set, runs with that spec
// after the job, for example to check and drop the table that a job wrote.
ext.registerDataflowBenchmark = { Map cfg ->
  def benchDir = "${rustDir}/scripts/benchmarks/${cfg.dir}"
  def shape = (project.findProperty('shape') ?: (cfg.defaultShape ?: 'count')).toString()
  def writes = (cfg.writeShapes ?: []).contains(shape)
  def usesRust = benchReader == 'rust' || (writes && benchWriter == 'rust')
  def javaClasses = file("${buildDir}/java-benchmark/${cfg.dir}/classes")

  tasks.register(cfg.compileTask, JavaCompile) {
    group = 'Build'
    description = "Compile the ${cfg.dir} Java benchmark against a released Java SDK ([-PbenchmarkBeamVersion=2.76.0])"
    source = fileTree("${benchDir}/java") { include '**/*.java' }
    classpath = configurations.javaBenchmark
    destinationDirectory = javaClasses
    sourceCompatibility = '11'
    targetCompatibility = '11'
    options.release = 11
  }

  tasks.register(cfg.task) {
    group = 'Verification'
    description = cfg.description
    dependsOn(benchPipeline == 'java' ? cfg.compileTask : 'setupBenchmarkPythonEnv')
    if (cfg.afterRun && writes) {
      dependsOn 'setupBenchmarkPythonEnv'
    }
    if (usesRust) {
      dependsOn 'gcpExpansionServiceDataflowImage'
    }

    doLast {
      if (!['python', 'java'].contains(benchPipeline)) {
        throw new GradleException("Unknown pipeline '${benchPipeline}': use python or java.")
      }
      if (cfg.shapes && !cfg.shapes.contains(shape)) {
        throw new GradleException("Unknown shape '${shape}': use ${cfg.shapes.join(', ')}.")
      }
      def readers = cfg.readers[benchPipeline]
      if (!readers.contains(benchReader)) {
        throw new GradleException(
            "Unknown reader '${benchReader}' for a ${benchPipeline} pipeline: use ${readers.join(', ')}.")
      }
      if (writes) {
        def writers = cfg.writers[benchPipeline]
        if (!writers.contains(benchWriter)) {
          throw new GradleException((benchWriter ?
              "Unknown writer '${benchWriter}' for a ${benchPipeline} pipeline. " :
              "Shape '${shape}' needs -Pwriter. ") + "Use ${writers.join(', ')}.")
        }
      } else if (benchWriter) {
        throw new GradleException("Shape '${shape}' does not write, so it takes no -Pwriter. " +
            "Use a shape that writes (${(cfg.writeShapes ?: []).join(', ')}) or remove -Pwriter.")
      }
      def gcpProject = gcpProjectFrom(benchProps)
      def gcpTempLocation = benchProps('gcpTempLocation', 'GCP_TEMP_LOCATION')
      if (!gcpProject || !gcpTempLocation) {
        throw new GradleException('Set gcpProject and gcpTempLocation in sdks/rust/.local/sdk.properties or with -P.')
      }
      def workers = (project.findProperty('numWorkers') ?: '4').toString()
      def maxWorkers = (project.findProperty('maxNumWorkers') ?: workers).toString()
      def autoscaling = maxWorkers.toInteger() > workers.toInteger()
      def spec = cfg.configure ? cfg.configure([shape: shape, writes: writes]) : [:]
      def readerLabel = (spec.readerLabel ?: benchReader).toString()
      def variantLabel = writes ? "${readerLabel}-to-${benchWriter}" : readerLabel
      def jobSuffix = spec.jobSuffix ? "-${spec.jobSuffix}" : ''
      def labels = [
        'benchmark': cfg.label,
        'pipeline': benchPipeline,
        'reader': readerLabel,
      ] + (writes ? ['writer': benchWriter] : [:]) + [
        'shape': shape.replace('_', '-'),
        'scaling': autoscaling ? 'autoscaling' : 'fixed',
      ] + (spec.labels ?: [:])
      def variantArgs = ["--reader=${benchReader}"] + (writes ? ["--writer=${benchWriter}"] : [])
      def pipelineArgs = variantArgs + [
        "--shape=${shape}",
        '--runner=DataflowRunner',
        "--project=${gcpProject}",
        "--region=${benchProps('gcpRegion', 'GCP_REGION', 'us-central1')}",
        "${benchFlag('temp_location')}=${gcpTempLocation}",
        "${benchFlag('num_workers')}=${workers}",
        "${benchFlag('max_num_workers')}=${maxWorkers}",
        "${benchFlag('autoscaling_algorithm')}=${autoscaling ? 'THROUGHPUT_BASED' : 'NONE'}",
        "${benchFlag(benchPipeline == 'java' ? 'worker_machine_type' : 'machine_type')}=" +
            "${project.findProperty('workerMachineType') ?: 'n2-standard-4'}",
        "${benchFlag('job_name')}=${cfg.jobPrefix}-${benchPipeline}-${variantLabel}-${shape.replace('_', '-')}" +
            "${jobSuffix}-${System.currentTimeMillis()}",
      ] + (spec.args ?: [])
      if (benchPipeline == 'java') {
        // The Java pipeline bills the jobs to --project. The Rust transforms run on Runner v2,
        // so the Java variants use it too and every job shares the same runner architecture.
        pipelineArgs << "--labels=${groovy.json.JsonOutput.toJson(labels)}"
        pipelineArgs << '--experiments=use_runner_v2'
      } else {
        pipelineArgs << "--billing_project=${gcpProject}"
        labels.each { name, value -> pipelineArgs << "--labels=${name}=${value}" }
      }
      // Additional pipeline flags in the style of the selected SDK, for example
      // -PextraArgs="--dataflow_service_options=enable_google_cloud_profiler" (Python) or
      // -PextraArgs="--dataflowServiceOptions=enable_google_cloud_profiler" (Java).
      project.findProperty('extraArgs')?.toString()?.tokenize(' ')?.each { pipelineArgs << it }
      ['network', 'subnetwork'].each { key ->
        def value = benchProps(key)
        if (value) {
          pipelineArgs << "--${key}=${value}"
        }
      }

      def service = null
      if (usesRust) {
        service = startGcpExpansionService(rustImageName('gcp_expansion_service', benchRoot))
        pipelineArgs << "${benchFlag('expansion_service')}=localhost:${service.port}"
      }
      try {
        if (benchPipeline == 'java') {
          project.javaexec {
            classpath = files(javaClasses) + configurations.javaBenchmark
            mainClass = cfg.mainClass
            args = pipelineArgs*.toString()
          }
        } else {
          project.exec {
            commandLine(["${benchVenv}/bin/python", "${benchDir}/python/${cfg.pythonScript}"] +
                pipelineArgs*.toString())
          }
        }
      } finally {
        if (service) {
          stopExpansionService(service)
        }
      }
      if (cfg.afterRun && writes) {
        cfg.afterRun(spec)
      }
    }
  }
}

fileTree("${rustDir}/scripts/benchmarks") {
  include '*/benchmark.gradle'
}.files.sort().each { apply from: it }

// Shared workspace configuration, GCP property resolution, and launch environment helpers
// imported by prism.gradle, dataflow.gradle, containers.gradle, validates-runner.gradle,
// and quality.gradle.

ext.rustWorkspaceTree = project.fileTree(rustDir) {
  include '**/*.rs'
  include '**/Cargo.toml'
  include 'Cargo.lock'
  exclude 'target/**'
  exclude 'container/**'
  exclude 'build/**'
}

def localProps = new Properties()
def localPropsFile = file("${projectDir}/.local/sdk.properties")
if (localPropsFile.exists()) {
  localPropsFile.withInputStream { localProps.load(it) }
}
ext.localProps = localProps

ext.selectedExample = (project.findProperty('example') ?: 'wordcount').toString()
ext.workerArch = (project.findProperty('exampleArch') ?: 'amd64').toString()
ext.workerBinaryFor = { String example, String arch -> file("${buildDir}/linux_${arch}/${example}") }

// Property resolver bound to one scope (`example.<scope>.<prop>` -> `<prop>` -> ENV -> fallback),
// with `-P<prop>` always taking precedence.
ext.propsFor = { String scope ->
  return { String prop, String env = null, String fallback = null ->
    project.findProperty(prop)
        ?: localProps.getProperty("example.${scope}.${prop}")
        ?: localProps.getProperty(prop)
        ?: (env ? System.getenv(env) : null)
        ?: fallback
  }
}

ext.suppliedWorkerBinary = { String example -> propsFor(example)('workerBinary')?.toString() }

ext.gcpProjectFrom = { Closure resolve ->
  def p = resolve('gcpProject', 'GCP_PROJECT')
  if (!p) {
    try {
      def stdout = new ByteArrayOutputStream()
      project.exec {
        commandLine 'gcloud', 'config', 'get-value', 'project'
        standardOutput = stdout
        errorOutput = new ByteArrayOutputStream()
        ignoreExitValue = true
      }
      p = stdout.toString().trim()
      if (p.isEmpty() || p.contains('(unset)')) p = null
    } catch (Exception ignored) {}
  }
  return p
}

ext.portableGcpArgs = { Closure resolve ->
  def gcpProject = gcpProjectFrom(resolve)
  def gcpRegion = resolve('gcpRegion', 'GCP_REGION')
  def gcpTempLocation = resolve('gcpTempLocation', 'GCP_TEMP_LOCATION')
  return [
    gcpProject ? "--project=${gcpProject}" : null,
    gcpRegion ? "--region=${gcpRegion}" : null,
    gcpTempLocation ? "--temp_location=${gcpTempLocation}" : null,
  ].findAll { it != null }*.toString()
}

ext.dockerHost = { ->
  def configured = System.getenv('DOCKER_HOST')
  if (configured) return configured
  try {
    def stdout = new ByteArrayOutputStream()
    def result = project.exec {
      commandLine 'docker', 'context', 'inspect', '--format', '{{.Endpoints.docker.Host}}'
      standardOutput = stdout
      errorOutput = new ByteArrayOutputStream()
      ignoreExitValue = true
    }
    def endpoint = stdout.toString().trim()
    return (result.exitValue == 0 && !endpoint.isEmpty()) ? endpoint : null
  } catch (Exception ignored) {
    return null
  }
}

ext.googleCredentials = { ->
  def configured = System.getenv('GOOGLE_APPLICATION_CREDENTIALS')
  if (configured) return configured
  def wellKnown = file("${System.getProperty('user.home')}/.config/gcloud/application_default_credentials.json")
  return wellKnown.exists() ? wellKnown.absolutePath : null
}

ext.launchEnvironment = { ->
  def env = [
      BEAM_SDK_VERSION    : beamSdkVersion,
      BEAM_RELEASE_VERSION: beamReleaseVersion,
      BEAM_VERSION        : beamVersion,
      BEAM_PRISM_PATH     : prismHostBinary.absolutePath,
  ]
  def docker = dockerHost()
  if (docker) env['DOCKER_HOST'] = docker
  def credentials = googleCredentials()
  if (credentials) env['GOOGLE_APPLICATION_CREDENTIALS'] = credentials
  return env
}

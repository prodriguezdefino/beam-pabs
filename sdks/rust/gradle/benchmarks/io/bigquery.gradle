// BigQuery benchmark on Dataflow (`bigQueryBenchmark`).
//
// Shapes (-Pshape):
// - count, per_key: read the table and count. Only the reader changes.
// - copy: read the table, pass each row through a step in the language of the pipeline (the
//   e2e/rows counter), and write the rows to a new table in -Pdataset. After the job,
//   benchmarks/tools/check_table.py compares the rows and distinct -PdistinctColumn values with
//   the source table and drops the new table (-PkeepTable keeps it). The table has the name of
//   the job.
//
// Readers (-Preader, or -Preaders=a,b for one variant each): python, java, rust in a Python pipeline (-Ppipeline=python); java-native
// (BigQueryIO, with -PnativeOutput=tablerow|row and -PnativeFormat=avro|arrow), java-managed and
// rust in a Java pipeline (-Ppipeline=java); rust in a Rust pipeline (-Ppipeline=rust, count
// and copy, the rust/ crate `apache-beam-benchmark-bigquery`, all steps in one Rust SDK harness).
//
// Writers (-Pwriter or -Pwriters=a,b, copy only): java (WriteToBigQuery with STORAGE_WRITE_API) and rust in a
// Python pipeline; java-native (BigQueryIO with the Storage Write API), java-managed (file loads
// for a bounded input) and rust in a Java pipeline; rust in a Rust pipeline.
//
// A Java copy with -Preader=rust and -Pwriter=rust needs
// -PextraArgs="--experiments=data_buffer_size_limit=10000000", on fixed workers and with
// autoscaling. Without it, the job can stop (docs/rust-native-io-providers.md, section 4.1).

registerDataflowBenchmark(
    task: 'bigQueryBenchmark',
    compileTask: 'compileBigQueryJavaBenchmark',
    dir: 'bigquery',
    label: 'bigquery',
    jobPrefix: 'bq',
    pythonScript: 'bigquery_benchmark.py',
    mainClass: 'BigQueryBenchmark',
    counter: 'rows',
    // The Rust count also adds its rows to e2e/rows.
    counterShapes: benchPipeline == 'rust' ? ['count', 'copy'] : ['copy'],
    io: { shape -> [namespace: 'e2e', rows: 'rows'] },
    rustPackage: 'apache-beam-benchmark-bigquery',
    rustShapes: ['count', 'copy'],
    shapes: ['count', 'per_key', 'copy'],
    writeShapes: ['copy'],
    readers: [
      python: ['python', 'java', 'rust'],
      java: ['java-native', 'java-managed', 'rust'],
      rust: ['rust'],
    ],
    writers: [
      python: ['java', 'rust'],
      java: ['java-native', 'java-managed', 'rust'],
      rust: ['rust'],
    ],
    description: 'Read a BigQuery table on Dataflow, and for -Pshape=copy write it to a new table ' +
        '([-Ppipeline=python|java|rust] [-Pshape=count|per_key|copy] ' +
        '-Preader=python|java|rust (Python) or java-native|java-managed|rust (Java) or rust (Rust) ' +
        '[-Pwriter=java|rust (Python) or java-native|java-managed|rust (Java) or rust (Rust), copy only] ' +
        '[-Ptable=<spec>] [-ProwRestriction=<filter>] [-Pquery=<sql>] [-PselectedFields=a,b] ' +
        '[-Pkey=language] [-PexpectedRows=<n>] [-PnativeOutput=tablerow|row] [-PnativeFormat=avro|arrow] ' +
        '[-Pcompression=NONE|LZ4_FRAME|ZSTD] [-Pdataset=<project.dataset>] ' +
        '[-Psemantics=exactly_once|at_least_once] [-PdistinctColumn=revision_id] [-PkeepTable] ' +
        '[-PnumWorkers=4] [-PmaxNumWorkers=<n>] [-PworkerMachineType=n2-standard-4] ' +
        '[-PextraArgs="<pipeline flags>"])',
    configure: { Map run ->
      def query = project.findProperty('query')?.toString()
      def selectedFields = project.findProperty('selectedFields')?.toString()
      def rowRestriction = project.findProperty('rowRestriction')?.toString()
      // Only the Rust reader takes a compression; the label keeps the jobs apart.
      def compression = (run.reader == 'rust' ? project.findProperty('compression') : null)?.toString()
      def compressionLabel = (compression ?: 'none').toLowerCase().replace('_', '-')
      // The BigQueryIO reader has variants; the reader label names the variant. copy reads
      // Beam rows, because every writer takes Beam rows.
      def nativeOutput = (project.findProperty('nativeOutput') ?: (run.writes ? 'row' : 'tablerow')).toString()
      def nativeFormat = (project.findProperty('nativeFormat') ?: 'avro').toString()
      def readerLabel = run.reader == 'java-native' ?
          "java-native-${nativeOutput}-${nativeFormat}" : run.reader
      def args = []
      if (run.reader == 'java-native') {
        args << "--nativeOutput=${nativeOutput}"
        args << "--nativeFormat=${nativeFormat}"
      }
      if (compression) {
        args << "--compression=${compression}"
      }
      def labels = ['compression': compressionLabel, 'source': query ? 'query' : 'table']
      def spec = [:]

      if (run.writes) {
        if (query || selectedFields) {
          throw new GradleException('-Pshape=copy reads whole rows of -Ptable: remove -Pquery and -PselectedFields.')
        }
        if (run.reader == 'java-native' && nativeOutput != 'row') {
          throw new GradleException('-Pshape=copy reads Beam rows: remove -PnativeOutput or set it to row.')
        }
        if (run.reader == 'python' && run.writer == 'rust') {
          throw new GradleException('The Python reader gives dicts, and the Rust writer takes Beam rows. ' +
              'Use -Pwriter=java with -Preader=python.')
        }
        def source = benchProps('table')?.toString()
        def dataset = benchProps('dataset')?.toString()
        if (!source || !dataset) {
          throw new GradleException('Set -Ptable and -Pdataset, or example.benchmark.table and ' +
              'example.benchmark.dataset in sdks/rust/.local/sdk.properties.')
        }
        def semantics = (project.findProperty('semantics') ?: 'exactly_once').toString()
        if (!['exactly_once', 'at_least_once'].contains(semantics)) {
          throw new GradleException("Unknown semantics '${semantics}': use exactly_once or at_least_once.")
        }
        // The table has the name of the job, so jobs never append to each other's rows.
        def destination = "${dataset}.{job_name_underscore}"
        args << "${run.flag('table')}=${source}"
        args << "${run.flag('destination')}=${destination}"
        args << "--semantics=${semantics}"
        if (rowRestriction) {
          args << "${run.flag('row_restriction')}=${rowRestriction}"
        }
        labels['semantics'] = semantics.replace('_', '-')
        spec = [source: source, destination: destination, semantics: semantics,
                rowRestriction: rowRestriction, gcpProject: run.gcpProject]
      } else {
        if (project.findProperty('semantics') || project.findProperty('dataset')) {
          throw new GradleException("-Psemantics and -Pdataset apply to -Pshape=copy only, not to ${run.shape}.")
        }
        // A query replaces the table, so the default table applies only without a query.
        def table = !query ? benchProps('table')?.toString() : project.findProperty('table')?.toString()
        if (table) {
          args << "${run.flag('table')}=${table}"
        }
        // The Rust pipeline has no row check: job_wait.py checks its e2e/rows counter.
        args += benchArgs(run, [
          query         : 'query',
          selectedFields: 'selected_fields',
          rowRestriction: 'row_restriction',
          key           : 'key',
        ] + (run.pipeline == 'rust' ? [:] : [expectedRows: 'expected_rows']))
      }
      if (rowRestriction) {
        labels['restricted'] = 'true'
      }
      spec + [
        readerLabel: readerLabel,
        labels     : labels,
        args       : args,
      ]
    },
    after: { spec ->
      def args = [
        "${benchVenv}/bin/python", "${rustDir}/benchmarks/tools/check_table.py",
        "--table=${spec.destination}", "--expected_table=${spec.source}",
        "--distinct_column=${project.findProperty('distinctColumn') ?: 'revision_id'}",
        "--project=${spec.gcpProject}",
      ]
      if (spec.rowRestriction) {
        args << "--expected_filter=${spec.rowRestriction}"
      }
      if (spec.semantics == 'at_least_once') {
        args << '--at_least'
      }
      if (!isSet('keepTable')) {
        args << '--drop'
      }
      args
    },
)

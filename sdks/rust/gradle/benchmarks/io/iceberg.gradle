// Iceberg benchmark on Dataflow (`icebergBenchmark`): Kafka to an Iceberg table of the BigLake
// REST catalog, in streaming.
//
// Shape `ingest`: read the DeviceMetric JSON records of -Ptopic, count each record in a step of
// the pipeline language (e2e/rows, and e2e/latency_ms from the Kafka record timestamp), parse
// it as the Python reference job does, and append it to a new table
// <namespace>.ingest_<job name> with -Pwriter. The table is partitioned by the hour of
// `timestamp_ms` and has the BigLake table properties of the reference job. With
// -PexpectedRows=<n> or -PdrainAfterSeconds=<s>, the job drains at that count or time.
//
// The check after the job expects every record of the topic in the table, and drops the table
// unless -PkeepTable. The topic is the reference, not the e2e/rows counter: a work item that
// Dataflow rejects at commit still reports its counters, so the counter can be above the rows.
// The reference is the largest committed offset of each partition over the consumer groups of
// -PkafkaCluster, so the topic must start empty and one job must read all of it. The producer
// is at least once, so the topic can hold a record twice. With -PkillWorkerAfterSeconds=<s>
// (Rust pipeline), the script deletes one worker VM at that time.
//
// Writers (-Pwriter): rust (native Kafka read and native Iceberg write) in a Rust pipeline;
// java-native (KafkaIO and IcebergIO) in a Java pipeline; java (Managed Kafka and Managed
// Iceberg, the reference job) in a Python pipeline.
//
// The load comes from `kafkaBenchmark -Pshape=produce -Ppipeline=java` with
// -PsamplePath=<gs://.../device_metrics.jsonl> (benchmarks/io/iceberg/testdata/device_metrics.jsonl): its
// placeholders give each record a unique id and the current time.
//
// With -PsamplePath (or example.benchmark.icebergSamplePath and -Prate, -PloadSeconds or
// -PsharedProducer), each round starts the ingest variants first, launches a companion
// `KafkaBenchmark` `--shape=produce` job once the ingest jobs enter RUNNING, waits for the
// producer to drain after -PloadSeconds, and drains the ingest jobs after
// -PidleAfterLoadSeconds. The defaults (100000 records/s for 1800 s, then 270 s) match the
// reference runs of docs/rust-native-io-providers.md, section 9.

registerDataflowBenchmark(
    task: 'icebergBenchmark',
    compileTask: 'compileIcebergJavaBenchmark',
    dir: 'iceberg',
    label: 'iceberg',
    jobPrefix: 'iceberg',
    pythonScript: 'iceberg_benchmark.py',
    mainClass: 'IcebergBenchmark',
    counter: 'rows',
    counterShapes: ['ingest'],
    io: { shape -> [namespace: 'e2e', rows: 'rows', streaming: true, latency: 'latency_ms',
                    buckets: 'latency_le_'] },
    rustPackage: 'apache-beam-benchmark-iceberg',
    rustShapes: ['ingest'],
    defaultShape: 'ingest',
    shapes: ['ingest'],
    readShapes: [],
    writeShapes: ['ingest'],
    writers: [
      python: ['java'],
      java  : ['java-native'],
      rust  : ['rust'],
    ],
    hasProducer: { shape -> kafkaProducerRequested() },
    producerDefaults: [rate: '100000', loadSeconds: '1800', idleAfterLoadSeconds: '270'],
    producer: { Map job ->
      def bootstrapServers = benchProps('bootstrapServers')?.toString()
      def topic = (project.findProperty('topic') ?: 'device-metrics').toString()
      kafkaProducerVariant(job, job.kafkaJavaArgs, [
        bootstrapServers: bootstrapServers,
        topic           : topic,
        format          : 'JSON',
        sampleKey       : 'icebergSamplePath',
      ])
    },
    description: 'Stream DeviceMetric records from Kafka to a BigLake Iceberg table on Dataflow ' +
        '([-Ppipeline=rust|java|python] -Pwriter=rust (Rust) or java-native (Java) or java ' +
        '(Python) [-PbootstrapServers=<host:port>] [-Ptopic=device-metrics] ' +
        '[-Pcatalog=<BigLake catalog>] [-Pnamespace=iceberg_bench] [-PtriggeringFrequency=60] ' +
        '[-PnumShards=<n>] [-PobjectStorage] [-PautoOffsetReset=earliest|latest] [-PgroupId=<id>] ' +
        '-PkafkaCluster=<cluster> (or example.benchmark.kafkaCluster) ' +
        '[-PsamplePath=<gs://...> [-Prate=100000] [-PloadSeconds=1800] [-PidleAfterLoadSeconds=270] ' +
        '[-PproducerExtraArgs="<producer flags>"] [-PsharedProducer=<id> [-PsharedProducerTasks=2]]] ' +
        '[-PexpectedRows=<n>] [-PdrainAfterSeconds=<s>] [-PkillWorkerAfterSeconds=<s>] ' +
        '[-PkeepTable] ' +
        '[-PnumWorkers=4] [-PmaxNumWorkers=<n>] [-PworkerMachineType=n2-standard-4] ' +
        '[-PextraArgs="<pipeline flags>"])',
    configure: { Map run ->
      def bootstrapServers = benchProps('bootstrapServers')?.toString()
      def catalog = (project.findProperty('catalog') ?: benchProps('icebergCatalog'))?.toString()
      if (!bootstrapServers || !catalog) {
        throw new GradleException('Set -PbootstrapServers and -Pcatalog (or ' +
            'example.benchmark.bootstrapServers and example.benchmark.icebergCatalog in ' +
            'sdks/rust/.local/sdk.properties).')
      }
      def namespace = (project.findProperty('namespace') ?: 'iceberg_bench').toString()
      def table = "${namespace}.ingest_{job_name_underscore}"
      def autoOffsetReset = (project.findProperty('autoOffsetReset') ?: 'earliest').toString()
      if (!['earliest', 'latest'].contains(autoOffsetReset)) {
        throw new GradleException("Unknown autoOffsetReset '${autoOffsetReset}': use earliest or latest.")
      }
      def frequency = (project.findProperty('triggeringFrequency') ?: '60').toString()
      def topic = (project.findProperty('topic') ?: 'device-metrics').toString()
      // The row check reads the committed offsets of this cluster, so a wrong one fails the round.
      def kafkaCluster = benchProps('kafkaCluster')?.toString() ?: (isSet('dryRun') ? '<kafkaCluster>' : null)
      if (!kafkaCluster) {
        throw new GradleException('Set -PkafkaCluster or example.benchmark.kafkaCluster in ' +
            'sdks/rust/.local/sdk.properties: the Managed Kafka cluster of -PbootstrapServers.')
      }
      def args = [
        "${run.flag('bootstrap_servers')}=${bootstrapServers}",
        "--topic=${topic}",
        "${run.flag('auto_offset_reset')}=${autoOffsetReset}",
        "--warehouse=bl://projects/${run.gcpProject}/catalogs/${catalog}",
        "--table=${table}",
        "${run.flag('user_project')}=${run.gcpProject}",
        "${run.flag('gcp_location')}=${run.region}",
        "${run.flag('triggering_frequency_seconds')}=${frequency}",
      ] + benchArgs(run, [groupId: 'group_id', numShards: 'num_shards'])
      if (isSet('objectStorage')) {
        args << run.flag('object_storage')
      }
      [
        catalog   : catalog,
        gcpProject: run.gcpProject,
        region    : run.region,
        table     : table,
        kafkaTopic: "${kafkaCluster}/${topic}",
        labels    : [frequency: "${frequency}s", offset: autoOffsetReset],
        args      : args,
      ]
    },
    after: { spec ->
      def args = [
        "${benchVenv}/bin/python", "${rustDir}/benchmarks/tools/check_iceberg_table.py",
        "--table=${spec.table}", "--catalog=${spec.catalog}", "--project=${spec.gcpProject}",
        "--region=${spec.region}", "--kafka_topic=${spec.kafkaTopic}", '--distinct_column=id,timestamp_ms',
      ]
      if (!isSet('keepTable')) {
        args << '--drop'
      }
      args
    },
)

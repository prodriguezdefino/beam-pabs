// Kafka benchmark on Dataflow (`kafkaBenchmark`), against Google Cloud Managed Service for Apache
// Kafka.
//
// Shapes (-Pshape):
// - load (batch): read -Ptable from BigQuery in the pipeline language, pass each row through a
//   step in the pipeline language (the e2e/rows counter), and write the rows to -Ptopic with
//   -Pwriter. Only the Kafka writer is under test.
// - copy (streaming): read -Ptopic with -Preader, pass each row through a step in the pipeline
//   language (the e2e/rows counter and the e2e/latency_ms distribution, from the Kafka record
//   timestamp to the step), and write the rows to -PdestinationTopic with -Pwriter. With
//   -PexpectedRows=<n> or -PdrainAfterSeconds=<s>, the launcher (or, for the Rust pipeline,
//   benchmarks/tools/job_wait.py) polls Dataflow until the job reaches that count or time,
//   drains the job, and waits for it to end. With -Pdetach, the launcher stops as soon as the
//   job runs and the report has no metrics of it, so a load job can run at the same time for an
//   end-to-end latency run.
// - produce (streaming, Java pipeline only): write -Prate records per second to -Ptopic from a
//   cycle of the JSON records in -PsamplePath (or example.benchmark.kafkaSamplePath), with
//   KafkaIO. It gives every copy variant the same offered load from a job that is not under
//   test, for the latency runs.
//
// Readers (-Preader, or -Preaders=a,b for one variant each, copy only): java (Managed I/O) and rust in a Python pipeline
// (-Ppipeline=python); java-native (KafkaIO), java-managed and rust in a Java pipeline
// (-Ppipeline=java); rust in a Rust pipeline (-Ppipeline=rust).
//
// Writers (-Pwriter or -Pwriters=a,b): java (Managed I/O) and rust in a Python pipeline; java-native (KafkaIO),
// java-managed and rust in a Java pipeline; rust in a Rust pipeline.
//
// The Rust pipeline (rust/, the `apache-beam-benchmark-kafka` crate) runs only the copy shape:
// the Kafka read of the Rust SDK, a Rust step and its Kafka write, all in one Rust SDK harness.
// It is the Rust counterpart of java-native to java-native in a Java pipeline.
//
// Formats (-Pformat): JSON decodes each record into a row and encodes it again; RAW wraps the
// record bytes in a row of one BYTES field; BYTES (copy only, rust to rust in a Rust pipeline or
// java-native to java-native in a Java pipeline) passes the record bytes from the read to the
// write with no row at all (ReadBytes/WriteBytes in Rust, KafkaIO byte[] in Java).

registerDataflowBenchmark(
    task: 'kafkaBenchmark',
    compileTask: 'compileKafkaJavaBenchmark',
    dir: 'kafka',
    label: 'kafka',
    jobPrefix: 'kafka',
    pythonScript: 'kafka_benchmark.py',
    mainClass: 'KafkaBenchmark',
    counter: 'rows',
    counterShapes: ['load', 'copy', 'produce'],
    // The produce job counts its rows in the namespace `produce`.
    io: { shape ->
      [namespace: shape == 'produce' ? 'produce' : 'e2e', rows: 'rows', streaming: shape != 'load'] +
          (shape == 'copy' ? [latency: 'latency_ms', buckets: 'latency_le_'] : [:])
    },
    rustPackage: 'apache-beam-benchmark-kafka',
    rustShapes: ['copy'],
    expansionImageTask: 'kafkaExpansionServiceDataflowImage',
    expansionImageName: 'kafka_expansion_service',
    defaultShape: 'load',
    shapes: ['load', 'copy', 'produce'],
    readShapes: ['copy'],
    writeShapes: ['load', 'copy'],
    readers: [
      python: ['java', 'rust'],
      java  : ['java-native', 'java-managed', 'rust'],
      rust  : ['rust'],
    ],
    writers: [
      python: ['java', 'rust'],
      java  : ['java-native', 'java-managed', 'rust'],
      rust  : ['rust'],
    ],
    hasProducer: { shape -> shape == 'copy' && kafkaProducerRequested() },
    producer: { Map job ->
      def bootstrapServers = benchProps('bootstrapServers')?.toString()
      def topic = project.findProperty('topic')?.toString()
      def format = (project.findProperty('format') ?: 'JSON').toString()
      kafkaProducerVariant(job, job.kafkaJavaArgs, [
        bootstrapServers: bootstrapServers,
        topic           : topic,
        format          : format == 'BYTES' ? 'RAW' : format,
        sampleKey       : 'kafkaSamplePath',
      ])
    },
    description: 'Write a BigQuery table to Kafka (-Pshape=load), stream a Kafka topic to ' +
        'another topic (-Pshape=copy), or write records at a fixed rate (-Pshape=produce) on ' +
        'Dataflow ' +
        '([-Ppipeline=python|java|rust (copy only)] [-Pshape=load|copy|produce] ' +
        '[-Preader=java|rust (Python) or java-native|java-managed|rust (Java) or rust (Rust), ' +
        'copy only] ' +
        '-Pwriter=java|rust (Python) or java-native|java-managed|rust (Java) or rust (Rust) ' +
        '-PbootstrapServers=<host:port> -Ptopic=<topic> ' +
        '[-PdestinationTopic=<topic>, copy only] [-Pformat=JSON|RAW|BYTES] ' +
        '[-Ptable=<spec>, load only] [-ProwRestriction=<filter>, load only] ' +
        '[-Prate=<records/s> -PsamplePath=<file> (or example.benchmark.kafkaSamplePath), ' +
        'produce or copy companion] ' +
        '[-PloadSeconds=300 -PidleAfterLoadSeconds=300 -PproducerExtraArgs="<producer flags>" ' +
        '-PsharedProducer=<id> -PsharedProducerTasks=2, copy companion] ' +
        '[-PautoOffsetReset=earliest|latest] [-PgroupId=<id>] ' +
        '[-PexpectedRows=<n>] [-PdrainAfterSeconds=<s>] [-Pdetach] ' +
        '[-PnumWorkers=4] [-PmaxNumWorkers=<n>] [-PworkerMachineType=n2-standard-4] ' +
        '[-PrunnerV1, Java pipeline without Rust transforms only] ' +
        '[-PextraArgs="<pipeline flags>"])',
    configure: { Map run ->
      def bootstrapServers = benchProps('bootstrapServers')?.toString()
      def topic = project.findProperty('topic')?.toString()
      if (!bootstrapServers || !topic) {
        throw new GradleException('Set -PbootstrapServers and -Ptopic (or ' +
            'example.benchmark.bootstrapServers in sdks/rust/.local/sdk.properties).')
      }
      def format = (project.findProperty('format') ?: 'JSON').toString()
      if (!['JSON', 'RAW', 'BYTES'].contains(format)) {
        throw new GradleException("Unknown format '${format}': use JSON, RAW or BYTES.")
      }
      // BYTES passes the record bytes with no row anywhere, so both ends must be native
      // connectors in the pipeline language: Managed I/O and the Rust expansion service
      // exchange rows.
      def bytesVariants = [rust: 'rust', java: 'java-native']
      if (format == 'BYTES' && (run.shape != 'copy' || !bytesVariants.containsKey(run.pipeline) ||
          run.reader != bytesVariants[run.pipeline] || run.writer != bytesVariants[run.pipeline])) {
        throw new GradleException('-Pformat=BYTES runs only -Pshape=copy, with -Ppipeline=rust ' +
            '-Preader=rust -Pwriter=rust, or -Ppipeline=java -Preader=java-native ' +
            '-Pwriter=java-native.')
      }
      def args = [
        "${run.flag('bootstrap_servers')}=${bootstrapServers}",
        "--topic=${topic}",
        "--format=${format}",
      ]
      def labels = ['format': format.toLowerCase()]
      def readerLabel = null

      if (run.shape == 'produce') {
        if (run.pipeline != 'java') {
          throw new GradleException('-Pshape=produce runs in a Java pipeline only: add -Ppipeline=java.')
        }
        ['destinationTopic', 'autoOffsetReset', 'groupId', 'table', 'rowRestriction'].each { prop ->
          if (project.hasProperty(prop)) {
            throw new GradleException("-P${prop} does not apply to -Pshape=produce.")
          }
        }
        def rate = project.findProperty('rate')?.toString()
        if (!rate) {
          throw new GradleException('-Pshape=produce needs -Prate=<records/s>.')
        }
        def samplePath = benchSamplePath('kafkaSamplePath')
        args << "--rate=${rate}"
        args << "--samplePath=${samplePath}"
        labels['rate'] = rate
        readerLabel = 'producer'
      } else if (run.shape == 'load') {
        ['destinationTopic', 'autoOffsetReset', 'groupId', 'drainAfterSeconds', 'detach'].each { prop ->
          if (project.hasProperty(prop)) {
            throw new GradleException("-P${prop} applies to -Pshape=copy only, not to load.")
          }
        }
        def table = benchProps('table')?.toString()
        if (!table) {
          throw new GradleException(
              'Set -Ptable or example.benchmark.table in sdks/rust/.local/sdk.properties.')
        }
        args << "--table=${table}"
        def rowRestriction = project.findProperty('rowRestriction')?.toString()
        if (rowRestriction) {
          args << "${run.flag('row_restriction')}=${rowRestriction}"
          labels['restricted'] = 'true'
        }
      } else {
        if (project.hasProperty('rowRestriction')) {
          throw new GradleException('-ProwRestriction applies to -Pshape=load only, not to copy.')
        }
        def destinationTopic = project.findProperty('destinationTopic')?.toString()
        if (!destinationTopic) {
          throw new GradleException('-Pshape=copy needs -PdestinationTopic.')
        }
        def autoOffsetReset = (project.findProperty('autoOffsetReset') ?: 'earliest').toString()
        if (!['earliest', 'latest'].contains(autoOffsetReset)) {
          throw new GradleException(
              "Unknown autoOffsetReset '${autoOffsetReset}': use earliest or latest.")
        }
        args << "${run.flag('destination_topic')}=${destinationTopic}"
        args << "${run.flag('auto_offset_reset')}=${autoOffsetReset}"
        args += benchArgs(run, [groupId: 'group_id'])
        labels['offset'] = autoOffsetReset
      }
      [
        readerLabel: readerLabel,
        labels     : labels,
        args       : args,
      ]
    },
)

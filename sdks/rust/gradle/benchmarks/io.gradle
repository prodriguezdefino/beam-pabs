// Dataflow benchmarks of the I/O connectors (gradle/benchmarks/io/*.gradle).
//
// benchmarks/io holds one directory for each benchmark, with one pipeline for each SDK
// (python/, java/, and optionally rust/, a crate of the Cargo workspace). Each
// gradle/benchmarks/io/<io>.gradle script gives one variant for each reader and writer to
// runDataflowBenchmark (gradle/benchmarks.gradle), which runs the rounds and writes the report.
//
// This script sets up the released Python and Java SDKs (-PbenchmarkBeamVersion) and provides
// registerDataflowBenchmark to gradle/benchmarks/io/*.gradle.

ext.benchProps = propsFor('benchmark')
ext.benchRoot = benchProps('dataflowRepositoryRoot')?.toString()
ext.benchVenv = file("${buildDir}/bench-venv")
ext.benchBeamVersion = (project.findProperty('benchmarkBeamVersion') ?: '2.76.0').toString()
ext.benchPipeline = (project.findProperty('pipeline') ?: 'python').toString()
def benchStamp = file("${benchVenv}/beam-version")

def refreshBenchVenv = !benchStamp.exists() || benchStamp.text.trim() != benchBeamVersion
tasks.register('setupBenchmarkPythonEnv') {
  group = 'Build'
  description = 'Create a virtualenv with a released Python SDK for the Dataflow benchmarks ([-PbenchmarkBeamVersion=2.76.0] [-PpythonVersion=3.12])'
  onlyIf { refreshBenchVenv }

  doLast {
    def interpreter = "python${project.findProperty('pythonVersion') ?: '3.12'}"
    project.delete benchVenv
    project.exec { commandLine interpreter, '-m', 'venv', benchVenv.absolutePath }
    project.exec {
      commandLine "${benchVenv}/bin/pip", 'install', '--quiet', "apache-beam[gcp]==${benchBeamVersion}"
    }
    benchStamp.text = benchBeamVersion
  }
}

def ioBenchmarkPackages = [
  'apache-beam-benchmark-bigquery',
  'apache-beam-benchmark-bigtable',
  'apache-beam-benchmark-kafka',
  'apache-beam-benchmark-iceberg',
]

tasks.register('buildIoBenchmarkWorkers') {
  group = 'Build'
  description = 'Build all four Linux I/O benchmark worker binaries in one Cargo invocation (-PexampleArch=amd64)'
  inputs.files rustWorkspaceTree
  inputs.property('packages', ioBenchmarkPackages)
  inputs.property('arch', workerArch)
  inputs.property('sdkVersion', beamSdkVersion)
  inputs.property('targetCpu', project.findProperty('workerTargetCpu') ?: 'default')
  outputs.files(ioBenchmarkPackages.collect { workerBinaryFor(it, workerArch) })

  doLast {
    // Link one fat-LTO binary at a time so four concurrent LTO linkers do not exhaust Docker VM
    // memory; `apache-beam-benchmark-io` unifies features so `.rlib` dependencies compile once.
    ioBenchmarkPackages.each { pkg ->
      compileWorkers([pkg], workerArch, beamSdkVersion)
    }
  }
}

// Java benchmarks build against released artifacts from Maven, not against this tree.
// Nothing outside sdks/rust is needed.
repositories {
  maven { url 'https://packages.confluent.io/maven/' }
}
configurations {
  // The java plugin is not applied here. Request the runtime jars of a standard JVM,
  // matching runtimeClasspath (for example, the jre variant of Guava).
  javaBenchmark {
    canBeConsumed = false
    attributes {
      attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_RUNTIME))
      attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
      attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE,
          objects.named(LibraryElements, LibraryElements.JAR))
      attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
      attribute(TargetJvmEnvironment.TARGET_JVM_ENVIRONMENT_ATTRIBUTE,
          objects.named(TargetJvmEnvironment, TargetJvmEnvironment.STANDARD_JVM))
    }
  }
}
// Some jars publish only a shadowed variant, for example iceberg-bundled-guava of IcebergIO.
// The javaBenchmark configuration asks for external bundling, so accept a shadowed jar too.
class ShadowedIsExternal implements AttributeCompatibilityRule<Bundling> {
  void execute(CompatibilityCheckDetails<Bundling> details) {
    if (details.consumerValue?.name == Bundling.EXTERNAL &&
        details.producerValue?.name == Bundling.SHADOWED) {
      details.compatible()
    }
  }
}
dependencies.attributesSchema {
  attribute(Bundling.BUNDLING_ATTRIBUTE) {
    compatibilityRules.add(ShadowedIsExternal)
  }
}
dependencies {
  ['beam-sdks-java-core', 'beam-sdks-java-managed', 'beam-sdks-java-io-google-cloud-platform',
   'beam-sdks-java-io-kafka', 'beam-sdks-java-io-iceberg',
   'beam-runners-google-cloud-dataflow-java'].each {
    javaBenchmark "org.apache.beam:${it}:${benchBeamVersion}"
  }
  // The IcebergIO POM leaves out its runtime catalog modules. The BigLake catalog needs the
  // Google auth manager and GCSFileIO of iceberg-gcp. Keep the version of IcebergIO.
  javaBenchmark 'org.apache.iceberg:iceberg-gcp:1.11.0'
  // KafkaIO compiles with kafka-clients as provided, so the worker classpath needs it explicitly.
  javaBenchmark 'org.apache.kafka:kafka-clients:3.9.2'
  // The JSON format of KafkaIO reads JSON Schemas with everit, which Beam does not ship.
  // Keep the version in sync with `everit_json_version` in BeamModulePlugin.
  javaBenchmark 'com.github.erosb:everit-json-schema:1.14.2'
  // BigQueryStorageArrowReader needs an Arrow buffer allocator on the worker classpath.
  javaBenchmark 'org.apache.arrow:arrow-memory-netty:17.0.0'
  // PAssert (the row check) needs JUnit and Hamcrest at run time.
  javaBenchmark 'junit:junit:4.13.2'
  javaBenchmark 'org.hamcrest:hamcrest:2.1'
  javaBenchmark 'org.slf4j:slf4j-jdk14:2.0.16'
}

// Starts the expansion service from the linux/amd64 worker image. One image serves both
// roles, and Application Default Credentials let providers read cloud metadata at expansion.
ext.startGcpExpansionService = { String image ->
  def credentials = googleCredentials()
  if (!credentials) {
    throw new GradleException('No Application Default Credentials. Run gcloud auth application-default login.')
  }
  startExpansionService(image: image, platform: 'linux/amd64', credentials: credentials)
}

// Formats a flag name for `pipeline`: snake_case for Python and Rust, lowerCamelCase for Java.
ext.benchFlag = { String pipeline, String name ->
  "--${pipeline == 'java' ? name.replaceAll(/_([a-z])/) { it[1].toUpperCase() } : name}".toString()
}

// Formats present `-P<prop>` values into `--<flag>=<value>` flags in the style of `run.pipeline`.
ext.benchArgs = { Map run, Map<String, String> propToFlag ->
  propToFlag.collectMany { String prop, String flag ->
    def value = project.findProperty(prop)?.toString()
    value ? ["${run.flag(flag)}=${value}".toString()] : []
  }
}

// Comma-separated values of -P<plural>, else of -P<single>, else `fallback`.
def benchChoices = { String plural, String single, String fallback ->
  (project.findProperty(plural) ?: project.findProperty(single) ?: fallback)?.toString()
      ?.tokenize(',')?.collect { it.trim() }?.findAll { it }?.unique() ?: []
}
ext.benchReaders = benchChoices('readers', 'reader', 'rust')
ext.benchWriters = benchChoices('writers', 'writer', null)

// Companion producer settings: -P<prop>, else the `producerDefaults` of the benchmark, else these.
ext.companionDefaults = [rate: '10000', loadSeconds: '300', idleAfterLoadSeconds: '300']
ext.companionSetting = { Map defaults, String prop ->
  (project.findProperty(prop) ?: (defaults ?: [:])[prop] ?: companionDefaults[prop]).toString()
}

// -PsamplePath, else example.benchmark.<key>. Each benchmark has its own key, so a Kafka topic
// never gets the sample of another benchmark. A dry run prints a placeholder.
ext.benchSamplePath = { String key ->
  def path = (project.findProperty('samplePath') ?: localProps.getProperty("example.benchmark.${key}"))?.toString()
  if (!path && !isSet('dryRun')) {
    throw new GradleException("Set -PsamplePath=<gs://...> or example.benchmark.${key} in " +
        'sdks/rust/.local/sdk.properties.')
  }
  path ?: "<${key}>".toString()
}

// Uniform "wait" specification for every submitted Dataflow benchmark job across all SDKs.
// Every launcher submits its job and exits; benchmarks/tools/job_wait.py polls and drains.
def waitSpec = { Map cfg, String shape, boolean hasProducer ->
  if (isSet('detach')) {
    return [detach: true]
  }
  def hasCounter = (cfg.counterShapes ?: []).contains(shape)
  def idleSeconds = hasProducer ?
      companionSetting(cfg.producerDefaults, 'idleAfterLoadSeconds').toLong() : null
  [
    counter                     : hasCounter ? cfg.counter : null,
    expected_rows               : hasCounter ? project.findProperty('expectedRows')?.toString()?.toLong() : null,
    drain_after_seconds         : project.findProperty('drainAfterSeconds')?.toString()?.toLong(),
    drain_after_producer_seconds: idleSeconds,
    kill_worker_after_seconds   : project.findProperty('killWorkerAfterSeconds')?.toString()?.toLong(),
  ].findAll { it.value != null }
}

// Flags that every Python or Java job of a benchmark run receives, plus -P<extraArgsProp>.
def jobFlags = { String pipeline, Map job, String extraArgsProp = 'extraArgs' ->
  def flag = { String name -> benchFlag(pipeline, name) }
  def experiments = minCpuExperiments()
  def flags = [
    "--shape=${job.shape}",
    '--runner=DataflowRunner',
    "--project=${job.gcpProject}",
    "--region=${job.region}",
    "${flag('temp_location')}=${job.tempLocation}",
    "${flag('num_workers')}=${job.workers}",
    "${flag('max_num_workers')}=${job.maxWorkers}",
    "${flag('autoscaling_algorithm')}=${job.autoscaling ? 'THROUGHPUT_BASED' : 'NONE'}",
    "${flag(pipeline == 'python' ? 'machine_type' : 'worker_machine_type')}=${job.machine}",
    "${flag('job_name')}={job_name}",
  ]
  if (pipeline == 'java') {
    // Rust transforms run on Runner v2, so Java jobs default to Runner v2 as well.
    def v2 = job.runnerV1 ? 'disable_runner_v2' : 'use_runner_v2'
    def allExperiments = ([v2] + (experiments ? [experiments] : [])).join(',')
    flags << "--experiments=${allExperiments}"
  } else {
    if (experiments) {
      flags << "--experiments=${experiments}"
    }
    if (pipeline == 'python') {
      flags << "--billing_project=${job.gcpProject}"
    }
  }
  // The image override in sdk.properties is for development: benchmarks run the release images.
  // -PextraArgs can still set one.
  flags += dataflowOptionFlags(
      benchProps, pipeline,
      ['numWorkers', 'maxNumWorkers', 'autoscalingAlgorithm', 'workerMachineType', 'experiments',
       'sdkHarnessContainerImageOverrides'])
  flags += project.findProperty(extraArgsProp)?.toString()?.tokenize(' ') ?: []
  flags*.toString()
}

// Launch command for Python or Java benchmark pipelines.
def sdkLaunchCommand = { Map cfg, String pipeline, List<String> args, File javaArgs ->
  if (pipeline == 'java') {
    return [argv: ["${System.getProperty('java.home')}/bin/java", "@${javaArgs}", cfg.mainClass] +
        args + ['--labels={labels_json}']]
  }
  def script = "${rustDir}/benchmarks/io/${cfg.dir}/python/${cfg.pythonScript}"
  [argv: ["${benchVenv}/bin/python", script] + args + ['{labels_args}']]
}

// Builds a companion `KafkaBenchmark` `--shape=produce` variant started once measured jobs run.
// The consumer -PextraArgs can hold flags of another SDK, so the producer takes
// -PproducerExtraArgs only.
ext.kafkaProducerRequested = { ->
  ['samplePath', 'rate', 'loadSeconds', 'sharedProducer'].any { project.hasProperty(it) }
}

ext.kafkaProducerVariant = { Map job, File kafkaJavaArgs, Map opts ->
  def samplePath = benchSamplePath(opts.sampleKey)
  def rate = companionSetting(job.producerDefaults, 'rate')
  def loadSeconds = companionSetting(job.producerDefaults, 'loadSeconds').toLong()
  def producerWorkers = (project.findProperty('producerWorkers') ?: '4').toString()
  def producerJob = job + [shape: 'produce', workers: producerWorkers, maxWorkers: producerWorkers,
                           autoscaling: false, runnerV1: false]
  def args = [
    "--bootstrapServers=${opts.bootstrapServers}",
    "--topic=${opts.topic}",
    "--format=${opts.format ?: 'JSON'}",
    "--rate=${rate}",
    "--samplePath=${samplePath}",
  ] + jobFlags('java', producerJob, 'producerExtraArgs')
  [
    label   : 'producer',
    cwd     : rustDir.toString(),
    describe: "Kafka producer (${rate} records/s for ${loadSeconds} s)",
    labels  : [pipeline: 'java', shape: 'produce', rate: rate, format: (opts.format ?: 'JSON').toLowerCase()],
    argv    : (["${System.getProperty('java.home')}/bin/java", "@${kafkaJavaArgs}", 'KafkaBenchmark'] +
        args + ['--labels={labels_json}'])*.toString(),
    wait    : [counter: 'rows', namespace: 'produce', drain_after_seconds: loadSeconds],
  ]
}

// The directory and the task count of -PsharedProducer=<id>, or null. The benchmark tasks that
// pass the same id share one companion producer (see benchmarks/tools/dataflow_job.py).
ext.sharedProducerConfig = { ->
  def id = project.findProperty('sharedProducer')?.toString()
  id ? [dir  : file("${buildDir}/tmp/benchmarks/shared-producer/${id}").absolutePath,
        tasks: (project.findProperty('sharedProducerTasks') ?: '2').toString()] : null
}

// Checks -Ppipeline, -Pshape, the readers and the writers of a benchmark.
def checkChoices = { Map cfg, String shape, boolean reads, boolean writes ->
  def pipelines = ['python', 'java'] + (cfg.rustPackage ? ['rust'] : [])
  if (!pipelines.contains(benchPipeline)) {
    throw new GradleException("Unknown pipeline '${benchPipeline}': use ${pipelines.join(', ')}.")
  }
  if (cfg.shapes && !cfg.shapes.contains(shape)) {
    throw new GradleException("Unknown shape '${shape}': use ${cfg.shapes.join(', ')}.")
  }
  if (benchPipeline == 'rust' && !(cfg.rustShapes ?: []).contains(shape)) {
    throw new GradleException("The Rust pipeline runs only ${(cfg.rustShapes ?: []).join(', ')}, " +
        "not shape '${shape}'.")
  }
  [[reads, 'reader', benchReaders, cfg.readers, cfg.containsKey('readShapes') ? cfg.readShapes : cfg.shapes],
   [writes, 'writer', benchWriters, cfg.writers, cfg.writeShapes]].each { used, noun, chosen, known, shapes ->
    def valid = ((known ?: [:])[benchPipeline] ?: []).join(', ')
    if (!used && (project.hasProperty(noun) || project.hasProperty("${noun}s"))) {
      throw new GradleException("Shape '${shape}' does not use a ${noun}, so it takes no " +
          "-P${noun} or -P${noun}s. Use a shape that does (${(shapes ?: []).join(', ')}) or remove the property.")
    }
    if (used && !chosen) {
      throw new GradleException("Shape '${shape}' needs -P${noun} or -P${noun}s. Use ${valid}.")
    }
    chosen.findAll { used && !known[benchPipeline].contains(it) }.each {
      throw new GradleException("Unknown ${noun} '${it}' for a ${benchPipeline} pipeline: use ${valid}.")
    }
  }
}

// Builds the configured spec, labels and wait map for one (reader, writer) pair.
def buildVariantMeta = { Map cfg, Map job, String reader, String writer, boolean hasProducer ->
  def pipeline = benchPipeline
  def run = [
    shape       : job.shape,
    reads       : reader != null,
    writes      : writer != null,
    pipeline    : pipeline,
    reader      : reader,
    writer      : writer,
    gcpProject  : job.gcpProject,
    region      : job.region,
    tempLocation: job.tempLocation,
    flag        : { String name -> benchFlag(pipeline, name) },
  ]
  def usesRust = pipeline != 'rust' && (reader == 'rust' || writer == 'rust')
  if (job.runnerV1 && (pipeline != 'java' || usesRust)) {
    throw new GradleException('-PrunnerV1 applies only to a Java pipeline without Rust transforms: ' +
        'Rust transforms run on Runner v2.')
  }
  def spec = cfg.configure ? cfg.configure(run) : [:]
  def readerLabel = (spec.readerLabel ?: reader)?.toString()
  def label = (reader && writer ? "${readerLabel}-to-${writer}" : (writer ?: readerLabel)).toString()
  def roles = (reader ? [reader: readerLabel] : [:]) + (writer ? [writer: writer] : [:])
  def labels = [pipeline: pipeline] + roles +
      [shape: job.shape, scaling: job.autoscaling ? 'autoscaling' : 'fixed'] + (spec.labels ?: [:]) +
      (pipeline == 'java' ? [runner: job.runnerV1 ? 'v1' : 'v2'] : [:])
  [
    spec    : spec,
    usesRust: usesRust,
    label   : label,
    labels  : labels,
    describe: (roles + (spec.labels ?: [:])).collect { k, v -> "${k} ${v}" }.join(', '),
    wait    : waitSpec(cfg, job.shape, hasProducer),
    after   : (cfg.after && writer != null) ? cfg.after(spec)*.toString() : null,
  ]
}

// Variant for a Python or Java benchmark pipeline.
def benchSdkVariant = { Map cfg, Map job, String reader, String writer, boolean hasProducer ->
  def pipeline = benchPipeline
  def meta = buildVariantMeta(cfg, job, reader, writer, hasProducer)
  def args = (reader ? ["--reader=${reader}"] : []) + (writer ? ["--writer=${writer}"] : []) +
      jobFlags(pipeline, job) + (meta.spec.args ?: [])*.toString() +
      (meta.usesRust ? ["${benchFlag(pipeline, 'expansion_service')}=localhost:${job.expansionPort}"] : [])
  [
    label   : meta.label,
    cwd     : rustDir.toString(),
    labels  : meta.labels,
    describe: meta.describe,
    wait    : meta.wait,
  ] + sdkLaunchCommand(cfg, pipeline, args*.toString(), job.javaArgs) +
      (meta.after ? [after: meta.after] : [:])
}

// Variant for a Rust benchmark pipeline on `checkout` (from gitRefVariants), launched through
// `:sdks:rust:dataflow -Pexample=<crate>` with static flags in an args file.
def benchRustVariant = { Map cfg, Map job, Map checkout, boolean multiRef, String reader,
                         String writer, boolean hasProducer ->
  def meta = buildVariantMeta(cfg, job, reader, writer, hasProducer)
  def variantLabel = (multiRef ? "${checkout.label}-${meta.label}" : meta.label).toString()
  def rawFlags = (["--shape=${job.shape}"] +
      (reader ? ["--reader=${reader}"] : []) +
      (writer ? ["--writer=${writer}"] : []) +
      (meta.spec.args ?: [])*.toString() +
      (project.findProperty('extraArgs')?.toString()?.tokenize(' ') ?: []))*.toString()
  def staticFlags = rawFlags.findAll { !it.contains('{') }
  def templateFlags = rawFlags.findAll { it.contains('{') }

  def argsFile = file("${buildDir}/tmp/benchmarks/${cfg.task}-${variantLabel}-rust.args")
  argsFile.parentFile.mkdirs()
  argsFile.setText(staticFlags.join('\n') + '\n', 'UTF-8')

  def experiments = minCpuExperiments()
  def forwarded = dataflowPassthrough.findAll { key ->
    !(key in ['gcpProject', 'gcpRegion', 'gcpTempLocation', 'autoscalingAlgorithm'])
  }.collectMany { key ->
    def val = key == 'serviceAccountEmail'
        ? (benchProps('serviceAccount') ?: benchProps(key, 'SERVICE_ACCOUNT_EMAIL'))
        : benchProps(key)
    val != null && !val.toString().isEmpty() ? ["-P${key}=${val}".toString()] : []
  }
  def props = [
    "-PgcpProject=${job.gcpProject}",
    "-PgcpRegion=${job.region}",
    "-PgcpTempLocation=${job.tempLocation}",
    "-PnumWorkers=${job.workers}",
    "-PmaxNumWorkers=${job.maxWorkers}",
    "-PautoscalingAlgorithm=${job.autoscaling ? 'THROUGHPUT_BASED' : 'NONE'}",
    "-PworkerMachineType=${job.machine}",
    '-Pinput=none',
    '-Poutput=none',
    "-PextraArgsFile=${argsFile.absolutePath}",
  ] + (experiments ? ["-Pexperiments=${experiments}"] : []) + forwarded

  def base = rustDataflowVariant(checkout, cfg.rustPackage, props*.toString(), templateFlags.join(' '))
  base + [
    label   : variantLabel,
    labels  : meta.labels + (multiRef ? [ref: checkout.label] : [:]),
    describe: multiRef ? "${checkout.describe}, ${meta.describe}" : meta.describe,
    wait    : meta.wait,
  ] + (meta.after ? [after: meta.after] : [:])
}

// Registers a Dataflow benchmark task and its Java compile task for benchmarks/io/<dir>/.
// Supports -Preaders, -Pwriters, -Pruns, -Pbaseline (on -Ppipeline=rust), -PcompareTo,
// -PdryRun, -PprepareOnly, and optional companion load jobs (`cfg.producer`).
ext.registerDataflowBenchmark = { Map cfg ->
  def benchDir = "${rustDir}/benchmarks/io/${cfg.dir}"
  def shape = (project.findProperty('shape') ?: (cfg.defaultShape ?: 'count')).toString()
  def reads = ((cfg.containsKey('readShapes') ? cfg.readShapes : cfg.shapes) ?: []).contains(shape)
  def writes = (cfg.writeShapes ?: []).contains(shape)
  def usesRust = benchPipeline != 'rust' &&
      ((reads && benchReaders.contains('rust')) || (writes && benchWriters.contains('rust')))
  def hasProducer = cfg.hasProducer ? (cfg.hasProducer(shape) as boolean) : false
  def dryRun = isSet('dryRun')
  def javaClasses = file("${buildDir}/java-benchmark/${cfg.dir}/classes")
  def kafkaJavaClasses = file("${buildDir}/java-benchmark/kafka/classes")

  tasks.register(cfg.compileTask, JavaCompile) {
    group = 'Build'
    description = "Compile the ${cfg.dir} Java benchmark against a released Java SDK ([-PbenchmarkBeamVersion=2.76.0])"
    source = fileTree("${benchDir}/java") { include '**/*.java' }
    classpath = configurations.javaBenchmark
    destinationDirectory = javaClasses
    sourceCompatibility = '11'
    targetCompatibility = '11'
    options.release = 11
  }

  tasks.register(cfg.task) {
    group = 'Verification'
    description = cfg.description.replaceAll(/\)$/, ' [-Preaders=a,b] [-Pwriters=a,b] [-Pruns=1] ' +
        '[-Pbaseline=<git ref>] [-PcompareTo=<results.json>] [-PdryRun] [-PprepareOnly])')
    // A dry run prints the commands, so it builds nothing. Rust variants build in `prepare`.
    if (!dryRun) {
      if (benchPipeline == 'java') {
        dependsOn cfg.compileTask
      } else if (benchPipeline == 'python') {
        dependsOn 'setupBenchmarkPythonEnv'
      }
      if (cfg.after && writes) {
        dependsOn 'setupBenchmarkPythonEnv'
      }
      if (hasProducer) {
        dependsOn 'compileKafkaJavaBenchmark'
      }
      if (usesRust) {
        dependsOn(cfg.expansionImageTask ?: 'gcpExpansionServiceDataflowImage')
      }
    }

    doLast {
      checkChoices(cfg, shape, reads, writes)
      if (project.hasProperty('baseline') && benchPipeline != 'rust') {
        throw new GradleException('-Pbaseline compares git refs of a Rust pipeline: pass -Ppipeline=rust.')
      }
      def gcpProject = gcpProjectFrom(benchProps) ?: (dryRun ? '<gcpProject>' : null)
      def tempLocation = benchProps('gcpTempLocation', 'GCP_TEMP_LOCATION') ?: (dryRun ? '<gcpTempLocation>' : null)
      if (!gcpProject || !tempLocation) {
        throw new GradleException('Set gcpProject and gcpTempLocation in sdks/rust/.local/sdk.properties or with -P.')
      }
      def workers = (project.findProperty('numWorkers') ?: '4').toString()
      def maxWorkers = (project.findProperty('maxNumWorkers') ?: workers).toString()
      def javaArgs = file("${buildDir}/tmp/benchmarks/${cfg.task}-java.args")
      def kafkaJavaArgs = file("${buildDir}/tmp/benchmarks/${cfg.task}-producer-java.args")
      def job = [shape: shape, gcpProject: gcpProject, tempLocation: tempLocation,
                 region: benchProps('gcpRegion', 'GCP_REGION', 'us-central1').toString(),
                 workers: workers, maxWorkers: maxWorkers,
                 autoscaling: maxWorkers.toInteger() > workers.toInteger(),
                 machine: (project.findProperty('workerMachineType') ?: 'n2-standard-4').toString(),
                 runnerV1: isSet('runnerV1'), javaArgs: javaArgs, kafkaJavaArgs: kafkaJavaArgs,
                 expansionPort: '<port>']
      if (benchPipeline == 'java' && !dryRun) {
        javaArgs.parentFile.mkdirs()
        javaArgs.text = "-cp \"${(files(javaClasses) + configurations.javaBenchmark).asPath}\"\n"
      }
      if (hasProducer && !dryRun) {
        kafkaJavaArgs.parentFile.mkdirs()
        kafkaJavaArgs.text = "-cp \"${(files(kafkaJavaClasses) + configurations.javaBenchmark).asPath}\"\n"
      }
      def producer = hasProducer ? cfg.producer(job + [producerDefaults: cfg.producerDefaults]) : null
      def io = cfg.io ? cfg.io(shape) : null
      def runVariants = { List<Map> variants ->
        runDataflowBenchmark([
          task      : cfg.task,
          gcpProject: gcpProject,
          region    : job.region,
          runs      : 1,
          describe  : "${cfg.label} ${shape}, ${benchPipeline} pipeline, ${job.machine}, " +
              "${workers} to ${maxWorkers} workers.",
          namePrefix: "${cfg.jobPrefix}-${benchPipeline}-${shape}",
          current   : variants.last().label,
          workers   : workers,
          counter   : (cfg.counterShapes ?: []).contains(shape) ? cfg.counter : null,
          io        : io ? [pipeline: benchPipeline] + io : null,
          producer  : producer,
          shared    : producer ? sharedProducerConfig() : null,
        ], variants)
      }

      if (benchPipeline == 'rust') {
        gitRefVariants { List<Map> checkouts ->
          def multiRef = checkouts.size() > 1
          def variants = checkouts.collectMany { checkout ->
            (reads ? benchReaders : [null]).collectMany { reader ->
              (writes ? benchWriters : [null]).collect { writer ->
                benchRustVariant(cfg, job, checkout, multiRef, reader, writer, producer != null)
              }
            }
          }
          runVariants(variants)
        }
        return
      }

      def service = usesRust && !dryRun ?
          startGcpExpansionService(rustImageName(cfg.expansionImageName ?: 'gcp_expansion_service', benchRoot)) : null
      try {
        job.expansionPort = service?.port ?: job.expansionPort
        def variants = (reads ? benchReaders : [null]).collectMany { reader ->
          (writes ? benchWriters : [null]).collect { writer ->
            benchSdkVariant(cfg, job, reader, writer, producer != null)
          }
        }
        runVariants(variants)
      } finally {
        if (service) {
          stopExpansionService(service)
        }
      }
    }
  }
}

fileTree("${rustDir}/gradle/benchmarks/io") {
  include '*.gradle'
}.files.sort().each { apply from: it }

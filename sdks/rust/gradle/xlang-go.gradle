// Go cross-language ValidatesRunner tasks (`validatesCrossLanguageRunnerGoPrism`,
// `validatesCrossLanguageRunnerGoDataflow`, `goSdkDataflowImage`).

if (gradle.startParameter.taskNames.any { it.contains('CrossLanguageRunnerGo') }) {
  evaluationDependsOn(':sdks:go:test')
}

def goSdkImage = registerSdkDataflowImageTask(
    sdk: 'Go',
    imageSuffix: 'go_sdk',
    gradleTask: ':sdks:go:container:docker',
)

def runGoSuite = { String workerImage, List<String> goArgs ->
  def pattern = selectedTests { "TestXLang_${it}" }?.join('|')?.with { "^(${it})\$" } ?: '^TestXLang_'
  execWithExpansionService(workerImage: workerImage) { service ->
    workingDir "${rootDir}/sdks/go"
    commandLine(['./run_with_go_version.sh', 'test', '-v', './test/integration/xlang',
                 '-run', pattern,
                 "--expansion_addr=test:localhost:${service.port}"] + goArgs*.toString())
  }
}

registerXlangSuiteTasks(
    sdk: 'Go',
    testExamples: 'Prefix,GroupBy',
    dependsOn: [':runners:prism:goPrepare'],
    dataflowHint: '[-PgoSdkImage=<image>]',
    configurePrism: { task ->
      task.doLast {
        withPrismJobServer { jobPort ->
          runGoSuite(testingImage, [
            '--runner=portable',
            "--endpoint=localhost:${jobPort}",
            '--environment_type=LOOPBACK',
          ])
        }
      }
    },
    configureDataflow: { task ->
      task.doLast {
        if (!goSdkImage) {
          throw new GradleException('Set goSdkImage in sdks/rust/.local/sdk.properties or with -P (run :sdks:rust:goSdkDataflowImage).')
        }
        runGoSuite(dataflowImage, xlangDataflowFlags(
            runner: 'dataflow',
            tempSuffix: '/temp',
            machineTypeFlag: 'worker_machine_type',
            extraFlags: { temp ->
              [
                '-timeout', '1h',
                "--staging_location=${temp}/staging",
                '--environment_type=DOCKER',
                "--environment_config=${goSdkImage}",
              ]
            },
        ))
      }
    },
)

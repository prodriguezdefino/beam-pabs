# cargo-nextest configuration for the Rust SDK workspace.

[[profile.default.overrides]]
# These crates' tests are in-process and finish in well under a second, so one still
# running after 10s is deadlocked. Terminating it fails only that test instead of
# stalling the run, and lets cargo-mutants count such a mutant as caught, not timed out.
# Crates whose tests start Prism or reach real services keep the default.
filter = "package(apache-beam-harness) | package(apache-beam-core) | package(apache-beam-test-utils)"
slow-timeout = { period = "5s", terminate-after = 2 }

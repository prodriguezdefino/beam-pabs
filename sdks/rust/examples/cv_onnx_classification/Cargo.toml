[package]
name = "cv_onnx_classification"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Beam Rust SDK Computer Vision image classification example using universal ONNX Runtime (ort) on CPU/GPU"

[lib]
path = "src/lib.rs"

[[bin]]
name = "cv_onnx_classification"
path = "src/main.rs"

[dependencies]
beam = { workspace = true, features = ["prism", "dataflow", "fluent", "io-file", "gcs", "testing", "ml-onnx"] }
clap = { workspace = true }
serde = { workspace = true }
image = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
testing = { workspace = true, features = ["prism"] }

[lints]
workspace = true

[features]
default = []
cuda = ["beam/ml-onnx-cuda"]
tensorrt = ["beam/ml-onnx-tensorrt"]
coreml = ["beam/ml-onnx-coreml"]
dynamic = ["beam/ml-onnx-dynamic"]
download-binaries = ["beam/ml-onnx-download"]

[package]
name = "row_schemas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Beam Rust SDK row schemas example: #[derive(BeamRow)], nested rows, logical types and Compose"

[lib]
path = "src/lib.rs"

[[bin]]
name = "row_schemas"
path = "src/main.rs"

[dependencies]
# Both runners are linked so `--runner=prism|dataflow` can choose at run time.
beam = { workspace = true, features = ["prism", "dataflow"] }
# `serde` reads the records from JSON lines.
chrono = { workspace = true, features = ["serde"] }
rust_decimal = { workspace = true, features = ["serde"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }

[dev-dependencies]
# In-pipeline assertions (`TestPipeline`, `passert`) for the example tests.
beam = { workspace = true, features = ["testing"] }

[lints]
workspace = true

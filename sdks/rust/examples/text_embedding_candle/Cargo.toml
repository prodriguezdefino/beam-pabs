[package]
name = "text_embedding_candle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apache Beam Rust SDK Text Embedding example using Hugging Face Candle on CPU/GPU"

[lib]
path = "src/lib.rs"

[[bin]]
name = "text_embedding_candle"
path = "src/main.rs"

[dependencies]
beam = { workspace = true, features = ["prism", "dataflow", "fluent", "io-file", "gcs", "testing", "ml-candle"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tracing = { workspace = true }

[dev-dependencies]
testing = { workspace = true, features = ["prism"] }

[lints]
workspace = true

[features]
default = []
cuda = ["beam/ml-candle-cuda"]
metal = ["beam/ml-candle-metal"]


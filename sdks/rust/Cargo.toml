[workspace]
resolver = "3"
members = [
    "beam",
    "beam/model",
    "beam/core",
    "beam/derive",
    "beam/fluent",
    "beam/harness",
    "beam/external",
    "beam/expansion",
    "beam/ml",
    "beam/runners/*",
    "beam/io/*",
    "beam/io/gcp/expansion-service",
    "beam/io/gcp/googleapis",
    "beam/io/kafka/expansion-service",
    "beam/runner-tests",
    "beam/test-utils",
    "beam/testing",
    "examples/*",
    "scripts/benchmarks/bigtable/rust",
    "scripts/benchmarks/kafka/rust",
]
# Every member except the benchmark pipelines, so a bare `cargo build`, `cargo clippy` or
# `cargo test` does not compile them. The benchmark tasks select them with `-p`.
default-members = [
    "beam",
    "beam/model",
    "beam/core",
    "beam/derive",
    "beam/fluent",
    "beam/harness",
    "beam/external",
    "beam/expansion",
    "beam/ml",
    "beam/runners/*",
    "beam/io/*",
    "beam/io/gcp/expansion-service",
    "beam/io/gcp/googleapis",
    "beam/io/kafka/expansion-service",
    "beam/runner-tests",
    "beam/test-utils",
    "beam/testing",
    "examples/*",
]
exclude = [
    "examples/build",
]

[workspace.package]
version = "2.78.0-SNAPSHOT"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/apache/beam"
homepage = "https://beam.apache.org"

# Unused-code lints that rustc leaves allow-by-default, so `-D warnings` does not reach
# them. Declared here rather than on the Gradle command line so the IDE and a bare
# `cargo clippy` enforce the same set. Each member opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unused_qualifications = "warn"
unused_lifetimes = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
single_use_lifetimes = "warn"

[workspace.lints.clippy]
redundant_clone = "warn"
# Give a reason for each suppression. Use #[expect], so that stale ones cause a warning.
allow_attributes_without_reason = "warn"
# Library code reports errors instead of panicking; see clippy.toml for tests.
unwrap_used = "warn"
# Leftover debugging.
dbg_macro = "warn"
todo = "warn"
# Style.
uninlined_format_args = "warn"
manual_let_else = "warn"
semicolon_if_nothing_returned = "warn"

[workspace.dependencies]
prost = "0.14"
prost-types = "0.14"
tonic = { version = "0.14", features = ["tls-native-roots"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tokio = { version = "1.40", features = ["full", "test-util"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support", "async_tokio"] }
bytes = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
base64 = "0.22"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "2"
sync_wrapper = "1"
clap = { version = "4.5", features = ["derive", "string"] }
inventory = "0.3"
globset = "0.4"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
snap = "1.1"
zstd = { version = "0.14", default-features = false }
# Masked CRC32C of TFRecord framing.
crc32c = "0.6"
regex = "1.13"
foldhash = "0.2"
serde-saphyr = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
arc-swap = "1.7"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["fancy-regex"] }
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
google-cloud-storage = "1.18.0"
google-cloud-gax = "1.14.0"
google-cloud-auth = "1.16.0"
google-cloud-secretmanager-v1 = "1.14.0"
google-cloud-bigquery = "0.18.0"
google-cloud-bigquery-v2 = "1.0.0"
google-cloud-wkt = "1.9.0"
uuid = { version = "1", features = ["v4"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "3", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
proptest = "1"
wiremock = "0.6"
tempfile = "3"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
arrow-array = { version = "60.0.0", default-features = false }
arrow-buffer = { version = "60.0.0", default-features = false }
arrow-schema = { version = "60.0.0", default-features = false }
arrow-ipc = { version = "60.0.0", default-features = false, features = ["lz4", "zstd"] }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "flate2-zlib-rs", "lz4", "snap", "zstd"] }
arrow-avro = { version = "60.0.0", default-features = false, features = ["deflate", "snappy", "zstd"] }
# Static librdkafka, OpenSSL, zlib and zstd: the worker binary links only libc, libm and libgcc_s,
# which the distroless runtime image has. See docs/rust-native-io-providers.md, Kafka dependencies.
rdkafka = { version = "0.39", default-features = false, features = ["tokio", "libz-static", "zstd", "ssl-vendored"] }

# Internal workspace crates
beam = { package = "apache-beam", path = "beam", version = "2.78.0-SNAPSHOT" }
core = { package = "apache-beam-core", path = "beam/core", version = "2.78.0-SNAPSHOT" }
model = { package = "apache-beam-model", path = "beam/model", version = "2.78.0-SNAPSHOT" }
fluent = { package = "apache-beam-fluent", path = "beam/fluent", version = "2.78.0-SNAPSHOT" }
ml = { package = "apache-beam-ml", path = "beam/ml", version = "2.78.0-SNAPSHOT" }
harness = { package = "apache-beam-harness", path = "beam/harness", version = "2.78.0-SNAPSHOT" }
external = { package = "apache-beam-external", path = "beam/external", version = "2.78.0-SNAPSHOT" }
expansion = { package = "apache-beam-expansion", path = "beam/expansion", version = "2.78.0-SNAPSHOT" }
file = { package = "apache-beam-io-file", path = "beam/io/file", version = "2.78.0-SNAPSHOT" }
gcp = { package = "apache-beam-io-gcp", path = "beam/io/gcp", version = "2.78.0-SNAPSHOT", default-features = false }
googleapis = { package = "apache-beam-io-gcp-googleapis", path = "beam/io/gcp/googleapis", version = "2.78.0-SNAPSHOT" }
kafka_io = { package = "apache-beam-io-kafka", path = "beam/io/kafka", version = "2.78.0-SNAPSHOT" }
managed_io = { package = "apache-beam-io-managed", path = "beam/io/managed", version = "2.78.0-SNAPSHOT" }
arrow_io = { package = "apache-beam-io-arrow", path = "beam/io/arrow", version = "2.78.0-SNAPSHOT" }
parquet_io = { package = "apache-beam-io-parquet", path = "beam/io/parquet", version = "2.78.0-SNAPSHOT" }
avro_io = { package = "apache-beam-io-avro", path = "beam/io/avro", version = "2.78.0-SNAPSHOT" }
json_io = { package = "apache-beam-io-json", path = "beam/io/json", version = "2.78.0-SNAPSHOT" }
tfrecord_io = { package = "apache-beam-io-tfrecord", path = "beam/io/tfrecord", version = "2.78.0-SNAPSHOT" }
prism = { package = "apache-beam-runner-prism", path = "beam/runners/prism", version = "2.78.0-SNAPSHOT" }
dataflow = { package = "apache-beam-runner-dataflow", path = "beam/runners/dataflow", version = "2.78.0-SNAPSHOT" }
testing = { package = "apache-beam-testing", path = "beam/testing", version = "2.78.0-SNAPSHOT" }
testutils = { package = "apache-beam-test-utils", path = "beam/test-utils", version = "2.78.0-SNAPSHOT" }
derive = { package = "apache-beam-derive", path = "beam/derive", version = "2.78.0-SNAPSHOT" }

# Keep file:line in panic backtraces without full DWARF debug info.
[profile.dev]
debug = "line-tables-only"

# Omit debug info for third-party dependencies to speed up linking.
[profile.dev.package."*"]
debug = false

# The test profile inherits from dev, so it picks up both settings above.

# Profile for worker binaries shipped to a runner (`./gradlew :sdks:rust:buildWorker`).
#
# A worker spends its life in a handful of hot loops that cross many crates
# (harness -> coder -> user DoFn -> IO), so whole-program optimization pays off
# far more than the extra link time costs. Kept separate from `release` so that
# everyday `cargo build --release` stays quick.
[profile.worker]
inherits = "release"
lto = "fat"
codegen-units = 1
# file:line in panic backtraces and profiles from the fleet, without full DWARF.
debug = "line-tables-only"
